<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>my archive :)</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片档案">
<style>
  :root{
    --bg: #FBF6F7;
    --check-a: #fff5fd;
    --card: #FFFFFF;
    --ink: #4A3F42;
    --ink-soft: #B49CA5;
    --line: #F6DFE6;
    --theme: #e897a8;
    --theme-soft: #fce3ea;
    --status-bg: #fbe3ec;
    --gold: #E8B84A;
    --gold-soft: #FBF3DD;
    --radius: 20px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    min-height: 100vh; line-height: 1.6;
  }
  .app { width:100%; max-width: 720px; margin: 0 auto; padding: 18px 14px 90px; }
  .masthead{
    background: var(--card); border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 6px 20px rgba(255,143,171,0.14);
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px; gap: 12px;
  }
  .masthead-left{ display:flex; align-items:center; gap: 12px; flex:1; min-width:0; }
  .user-avatar{
    width: 50px; height: 50px; border-radius: 50%;
    background: #fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 24px; color: var(--theme); overflow:hidden; cursor:pointer;
    box-shadow: 0 2px 8px rgba(232,151,168,0.15);
  }
  .user-avatar img { width:100%; height:100%; object-fit:cover; }
  .masthead-titles { min-width:0; cursor:pointer; }
  .masthead-title{ font-size: 22px; font-weight: 800; }
  .masthead-eyebrow{
    font-family: Georgia, serif; font-style: italic;
    font-size: 12px; color: var(--theme); letter-spacing: 1px; margin-top: 2px;
  }
  .masthead-count{
    font-size: 12px; color: var(--ink-soft);
    background: var(--check-a); padding: 6px 12px;
    border-radius: 999px; white-space: nowrap;
  }
  .mode-switch-bar{
    display:flex; background: var(--card);
    border-radius: 999px; padding: 4px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .mode-btn{
    flex:1; text-align:center;
    padding: 9px 10px; font-size: 13px; font-weight: 700;
    border-radius: 999px; cursor:pointer;
    color: var(--ink-soft); transition: all .2s;
    border:none; background: transparent; font-family: inherit;
  }
  .mode-btn.active{
    background: linear-gradient(135deg, #FAE1EA, #F8D9E5);
    color: var(--theme);
  }
  .search-row{ margin-bottom: 14px; position:relative; }
  .search-row input{
    width:100%; background: var(--card); border: none;
    border-radius: 999px; padding: 13px 18px 13px 44px;
    font-size: 14px; font-family: inherit; color: var(--ink);
    outline: none; box-shadow: 0 3px 10px rgba(255,143,171,0.1);
  }
  .search-row input::placeholder{ color: var(--ink-soft); }
  .search-icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    z-index:2; pointer-events:none;
  }
  .search-icon svg{ width:18px; height:18px; display:block; }
  .tabs-wrap{ margin-bottom: 18px; }
  .tabs{
    display:flex; gap: 10px; overflow-x: auto;
    padding: 4px 2px 8px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer; min-width: 60px;
    padding: 8px 6px 6px; border-radius: 16px;
    transition: background .15s ease;
  }
  .tab.active{ background: linear-gradient(180deg, #FAE1EA 0%, #F8D9E5 45%, #FBEDF2 100%); }
  .tab-avatar{
    width: 48px; height:48px; border-radius: 50%;
    background: #ffffff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; color: var(--theme); font-size: 22px;
  }
  .tab-avatar .letter{ font-size: 19px; font-weight: 600; color: var(--theme); }
  .tab-avatar img{ width:100%; height:100%; object-fit:contain; }
  .tab-avatar svg{ width: 22px; height: 22px; }
  .tab.active .tab-avatar{ transform: scale(1.05); }
  .tab-status .tab-avatar { background: var(--status-bg); }
  .tab-label{
    font-size: 11px; color: var(--ink-soft);
    font-weight: 600; white-space: nowrap;
  }
  .tab.active .tab-label{ color: var(--theme); font-weight: 700; }
  .filter-row{ display:flex; gap: 8px; margin-bottom: 16px; }
  .filter-chip{
    font-size: 12.5px; font-weight: 600;
    padding: 7px 15px; border-radius: 999px;
    background: #ffffff; color: var(--ink-soft);
    border: none; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .filter-chip.active{
    background: var(--theme); color: #fff;
    box-shadow: 0 3px 10px rgba(232,151,168,0.35);
  }
  .stack{
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px; align-items: stretch;
  }
  @media (max-width: 390px){ .stack{ gap:10px; } }
  .entry{
    position: relative; background: var(--card);
    border-radius: 18px;
    box-shadow: 0 3px 12px rgba(255,143,171,0.10);
    padding: 14px 12px 12px;
    min-width:0; height: 220px;
    display:flex; flex-direction:column; gap: 7px;
    cursor:pointer;
  }
  .entry:active{ transform: scale(0.98); }
  .entry.pinned{ box-shadow: 0 3px 16px rgba(232,151,168,0.35); }
  .entry-ribbon{
    position:absolute; top: -2px; right: 16px;
    width: 22px; height: 28px; background: var(--theme);
    border-radius: 0 0 5px 5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 6px rgba(232,151,168,0.4);
    z-index: 2;
  }
  .entry-ribbon svg{ width: 12px; height: 12px; }
  .entry-avatar{
    width:40px; height:40px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; color: #fff; overflow:hidden;
  }
  .entry-avatar img{ width:100%; height:100%; object-fit:cover; }
  .entry-title{
    font-weight:700; font-size:14.5px; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cat-label {
    align-self:flex-start; border-radius: 10px;
    padding: 3px 10px; color: #444; font-weight: 600;
    font-size: 11px; background: #f0f0f0;
  }
  .entry-excerpt{
    font-size: 12px; color: var(--ink-soft); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.4em;
  }
  .entry-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: auto; padding-top: 4px;
  }
  .entry-date{ font-size: 10px; color: var(--ink-soft); }
  .entry-expand-btn{
    width: 24px; height:24px; border-radius: 50%;
    background: var(--check-a); border: none;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft); flex-shrink:0;
  }
  .entry-expand-btn svg{ width:14px; height:14px; }
  .detail-header{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .detail-avatar{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff; overflow:hidden; flex-shrink:0;
  }
  .detail-avatar img{ width:100%; height:100%; object-fit:cover; }
  .detail-title{ font-size:16px; font-weight:800; }
  .detail-meta{ font-size:11px; color: var(--ink-soft); margin-top:2px; }
  .entry-content{
    font-size: 13.5px; line-height: 1.8;
    white-space: pre-wrap; word-break: break-word;
    color: var(--ink); background: var(--card);
    border-radius: var(--radius-sm);
    padding: 13px 14px; margin-bottom: 10px;
    max-height: 320px; overflow-y: auto;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .entry-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{
    font-size: 12px; font-weight:600;
    padding: 8px 14px; border-radius: 999px;
    border: none; background: var(--check-a); color: var(--ink);
    cursor:pointer;
  }
  .btn:active{ transform: scale(0.96); }
  .btn.copy{ background: var(--theme); color: #fff; }
  .btn.copy.done{ background: #B9E4CE; }
  .btn.edit{ background: #BEE0F2; color: #37505c; }
  .btn.del{ background: transparent; color: var(--theme); margin-left:auto; }
  .empty{ text-align:center; padding: 70px 20px; color: var(--ink-soft); }
  .empty-emoji{ font-size: 34px; margin-bottom: 10px; }
  .empty-sub{ font-size: 12px; margin-top:6px; }
  .toggle-wrap { display: flex; align-items: center; gap: 12px; }
  .toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; cursor: pointer; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; inset: 0;
    background: #ddd; border-radius: 26px; transition: background .2s;
  }
  .toggle .slider::before {
    content: ""; position: absolute;
    height: 20px; width: 20px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .toggle input:checked + .slider { background: var(--theme); }
  .toggle input:checked + .slider::before { transform: translateX(18px); }
  .toggle-label { font-size: 13px; color: var(--ink); }
  .fab{
    position: fixed; right: 20px; bottom: 24px;
    width: 56px; height:56px; border-radius: 50%;
    background: var(--theme); color: #fff; font-size: 26px;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer;
    box-shadow: 0 6px 18px rgba(232,151,168,0.45);
    z-index: 20;
  }
  .fab:active{ transform: scale(0.94); }
  .overlay{
    position:fixed; inset:0;
    background: rgba(91,74,80,0.32);
    display:none; align-items:flex-end; z-index: 30;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--bg); width:100%; max-height: 90vh;
    border-radius: 26px 26px 0 0;
    padding: 20px 18px 24px;
    overflow-y:auto;
    animation: slideup .22s ease;
  }
  @keyframes slideup{ from{ transform: translateY(30px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  .sheet-title{
    font-size:17px; font-weight:800;
    margin-bottom:16px;
    display:flex; align-items:center; gap:6px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 12px;
    color: var(--ink-soft); margin-bottom:6px; font-weight:600;
  }
  .field input[type="text"], .field textarea, .field select{
    width:100%; background: var(--card); border:none;
    border-radius: var(--radius-sm);
    padding: 11px 14px; font-size:14px; font-family: inherit;
    color: var(--ink); outline:none;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .field textarea{ min-height: 150px; resize: vertical; line-height:1.6; }
  .field input:focus, .field textarea:focus, .field select:focus{ box-shadow: inset 0 0 0 1.5px var(--theme); }
  .cover-upload{ display:flex; align-items:center; gap:14px; }
  .cover-preview{
    width:64px; height:64px; border-radius:50%;
    background: var(--check-a);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; overflow:hidden; flex-shrink:0;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .cover-preview img{ width:100%; height:100%; object-fit:cover; }
  .cover-btns{ display:flex; flex-direction:column; gap:6px; }
  .cover-btn-row{ display:flex; gap:8px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions .btn{ flex:1; text-align:center; padding:12px; font-size:13.5px; }
  .btn.primary{ background: var(--theme); color: #fff; }
  .cat-manage-row{
    display:flex; align-items:center; gap:10px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 8px;
  }
  .cat-manage-row .cover-preview{ width:38px; height:38px; font-size:15px; }
  .cat-manage-name{ flex:1; font-size:14px; font-weight:600; min-width:0; }
  .cat-manage-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%;
    border:none; background: var(--check-a);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; color: var(--ink);
  }
  .icon-btn.del{ color: var(--theme); }
  .toast{
    position: fixed; top: 18px; left:50%; transform: translateX(-50%);
    background: var(--theme); color: #fff;
    font-size: 12.5px; font-weight:600;
    padding: 10px 18px; border-radius: 999px;
    z-index: 50; opacity:0; pointer-events:none;
    transition: opacity .2s ease, top .2s ease;
    box-shadow: 0 6px 16px rgba(232,151,168,0.4);
  }
  .toast.show{ opacity:1; top: 26px; }
  .hidden-file{ display:none; }
  .data-manage-section{
    margin-top: 18px; padding-top: 16px;
    border-top: 1.5px dashed var(--line);
  }
  .data-manage-title{
    font-size: 13px; font-weight: 700;
    color: var(--ink-soft); margin-bottom: 10px;
  }

  /* ============ 剧情指导：两栏 ============ */
  .guide-container{
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: 0 3px 14px rgba(255,143,171,0.10);
    overflow: hidden;
    height: calc(100vh - 260px);
    min-height: 460px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
  }
  .guide-top-bar{
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .guide-top-title{ font-size: 15px; font-weight: 800; }
  .guide-top-sub{ font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .guide-top-actions{ display: flex; gap: 6px; flex-shrink: 0; }
  .guide-top-btn{
    background: var(--gold-soft); color: var(--gold);
    font-size: 11px; font-weight: 700;
    padding: 6px 11px; border-radius: 999px;
    border: none; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .guide-top-btn.active{ background: var(--gold); color: #fff; }

  .guide-two-pane{
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .guide-left{
    width: 122px;
    background: #F7EEF2;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 6px 0;
  }
  .guide-left::-webkit-scrollbar{ width: 0; }

  /* 左栏分组小标题 */
  .guide-left-group{
    font-size: 9.5px;
    font-weight: 700;
    color: #A89099;
    letter-spacing: 1.5px;
    padding: 10px 12px 4px;
    text-transform: uppercase;
  }
  .guide-left-divider{
    height: 1px;
    background: #E5D4DB;
    margin: 8px 10px;
  }

  /* 篇章项（加粗大字） */
  .guide-left-pianzhang{
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #6C5A60;
    cursor: pointer;
    line-height: 1.3;
    border-left: 3px solid transparent;
    transition: background .15s;
  }
  .guide-left-pianzhang:hover{ background: rgba(255,255,255,0.5); }
  .guide-left-pianzhang.active{
    background: #FFF; color: var(--theme);
    border-left-color: var(--theme);
  }

  /* 章节项（缩进小字） */
  .guide-left-zhangjie{
    padding: 8px 10px 8px 22px;
    font-size: 11px;
    color: #8C7A82;
    cursor: pointer;
    line-height: 1.35;
    border-left: 3px solid transparent;
    font-weight: 500;
  }
  .guide-left-zhangjie:hover{ color: var(--theme); }
  .guide-left-zhangjie.active{
    background: #FFF; color: var(--theme);
    font-weight: 700;
    border-left-color: var(--theme);
  }

  .guide-left-fav{
    padding: 11px 6px; font-size: 11.5px;
    color: #6C5A60; cursor: pointer;
    border-left: 3px solid transparent;
    font-weight: 600; text-align: center;
  }
  .guide-left-fav.active{
    background: #FFF; color: var(--gold);
    border-left-color: var(--gold);
  }
  .guide-left-manage{
    padding: 11px 6px; font-size: 11px;
    color: var(--ink-soft); cursor: pointer;
    border-left: 3px solid transparent;
    text-align: center; margin-top: 8px;
    border-top: 1px dashed #E5D4DB;
  }
  .guide-left-manage:hover{ color: var(--theme); }

  .guide-right{
    flex: 1; overflow-y: auto;
    padding: 12px 12px 20px;
    min-width: 0;
    background: var(--bg);
  }
  .guide-right::-webkit-scrollbar{ width: 4px; }
  .guide-right::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 2px; }

  /* 右侧章节标题（粉色大字） */
  .guide-right-chapter-title{
    font-size: 14.5px;
    font-weight: 800;
    color: var(--theme);
    padding: 14px 6px 8px;
    margin-top: 4px;
    border-bottom: 2px solid var(--theme-soft);
    margin-bottom: 8px;
  }
  .guide-right-chapter-title:first-child{ margin-top: 0; }

  /* 右侧子章节（韩娱篇的三级） */
  .guide-right-group{
    font-size: 11px;
    font-weight: 700;
    color: #A89099;
    letter-spacing: 0.5px;
    padding: 10px 6px 6px;
  }

  /* 右侧条目卡片 */
  .guide-right-item{
    display: flex; align-items: flex-start; gap: 8px;
    padding: 11px 12px;
    background: #FFFFFF;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 12.5px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(232,151,168,0.08);
    line-height: 1.45;
    color: var(--ink);
    border: 1px solid #FBF0F4;
    position: relative;
  }
  .guide-right-item:active{ transform: scale(0.99); }
  .guide-right-item.faved{
    background: #FFFBEB;
    border-color: var(--gold-soft);
    border-left: 3px solid var(--gold);
    padding-left: 9px;
    box-shadow: 0 2px 10px rgba(232,184,74,0.18);
  }
  .guide-right-item .s{
    width: 14px; text-align: center;
    color: var(--ink-soft); font-size: 13px;
    flex-shrink: 0; line-height: 1.3;
  }
  .guide-right-item.faved .s{ color: var(--gold); }
  .guide-right-item.faved .t{ color: #8A6B2E; font-weight: 700; }
  .guide-right-item .t{ flex: 1; min-width: 0; }

  .guide-empty{
    text-align: center; padding: 50px 20px;
    color: var(--ink-soft); font-size: 12.5px;
  }
  .guide-empty-emoji{ font-size: 32px; margin-bottom: 10px; }
  .guide-empty-sub{ font-size: 11px; margin-top: 6px; }

  /* 收藏页条目：显示来源 */
  .guide-fav-card{
    background: #FFFBEB;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    border-left: 3px solid var(--gold);
    box-shadow: 0 2px 8px rgba(232,184,74,0.15);
  }
  .guide-fav-card:active{ transform: scale(0.99); }
  .guide-fav-title{
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
    color: #8A6B2E;
  }
  .guide-fav-title .s{ color: var(--gold); font-size: 14px; }
  .guide-fav-meta{
    font-size: 10.5px; color: #A89468;
  }

  .import-preview{
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 10px;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .import-preview-row{
    display:flex; justify-content:space-between;
    font-size: 13px; padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }
  .import-preview-row:last-child{ border-bottom: none; }
  .import-preview-row .k{ color: var(--ink-soft); font-weight: 600; }
  .import-preview-row .v{ font-weight: 700; color: var(--ink); }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="masthead-left">
      <div class="user-avatar" id="userAvatar" title="点击上传头像">👤</div>
      <input type="file" accept="image/*" class="hidden-file" id="userAvatarInput">
      <div class="masthead-titles" id="titleEditor">

<script>
const STORAGE_KEY = 'card-archive-data-v4';
const CAT_COLORS = ['#f2d4f6','#fae29c','#cde6fc','#ddefe3','#d3defb'];

let state = {
  categories: [
    { id: 'mask', name: '面具', cover: null },
    { id: 'npc', name: 'NPC', cover: null },
    { id: 'status', name: '状态栏', cover: null },
    { id: 'cmd', name: '指令', cover: null },
    { id: 'extra', name: '番外', cover: null }
  ],
  cards: [],
  guides: [],
  activeTab: 'all',
  activeFilter: 'edited',
  activeGuide: null,
  activeGuideSection: null,
  guideShowFav: false,
  userAvatar: null,
  mainTitle: '卡片档案',
  subtitle: 'my little',
  currentMode: 'card'
};
let currentDetailId = null;
let editingId = null;
let editingCatId = null;
let pendingCoverData = null;
let pendingImport = null;
let currentGuideItem = null;
let editingGuideItem = null;
let renamingGuideId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
}
function hasClaudeStorage(){ return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
function hasLocalStorage(){ try{ const t='__'+Date.now(); localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }catch(e){ return false; } }

async function loadData(){
  let raw = null;
  if(hasClaudeStorage()){
    try{ const res = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000); if(res && res.value) raw = res.value; }catch(e){}
  }
  if(raw === null && hasLocalStorage()){
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed.categories) state.categories = parsed.categories;
      if(parsed.cards) state.cards = parsed.cards;
      if(parsed.guides) state.guides = parsed.guides;
      if(parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if(parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if(parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
    }catch(e){}
  }
  state.cards.forEach(c => {
    if (c.pinned === undefined) c.pinned = false;
    if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
  });
  (state.guides || []).forEach(g => {
    (g.sections || []).forEach(s => {
      (s.items || []).forEach(it => {
        if (it.faved === undefined) it.faved = false;
        if (it.group === undefined) it.group = '';
      });
    });
  });
  if (state.guides.length > 0 && !state.activeGuide){
    state.activeGuide = state.guides[0].id;
  }
  renderAll();
}

async function saveData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    guides: state.guides,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle
  });
  let ok = false;
  if(hasClaudeStorage()){
    try{ await withTimeout(window.storage.set(STORAGE_KEY, payload, false), 5000); ok = true; }catch(e){}
  }
  if(hasLocalStorage()){
    try{ localStorage.setItem(STORAGE_KEY, payload); ok = true; }catch(e){}
  }
  if(!ok) showToast('⚠️ 保存失败！请导出备份');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),1600);
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

function renderTitle() {
  document.getElementById('titleDisplay').textContent = state.mainTitle || '卡片档案';
  document.getElementById('subtitleDisplay').textContent = state.subtitle || '';
}
document.getElementById('titleEditor').onclick = ()=>{
  document.getElementById('editMainTitle').value = state.mainTitle || '';
  document.getElementById('editSubtitle').value = state.subtitle || '';
  document.getElementById('titleOverlay').classList.add('show');
};
document.getElementById('titleCancelBtn').onclick = ()=> document.getElementById('titleOverlay').classList.remove('show');
document.getElementById('titleSaveBtn').onclick = ()=>{
  state.mainTitle = document.getElementById('editMainTitle').value.trim() || '卡片档案';
  state.subtitle = document.getElementById('editSubtitle').value.trim();
  document.getElementById('titleOverlay').classList.remove('show');
  renderTitle();
  saveData();
  showToast('标题已更新 ♡');
};
document.getElementById('titleOverlay').onclick = (e)=>{ if(e.target.id==='titleOverlay') document.getElementById('titleOverlay').classList.remove('show'); };

function renderAvatar() {
  const el = document.getElementById('userAvatar');
  if (state.userAvatar) el.innerHTML = `<img src="${state.userAvatar}" alt="avatar">`;
  else el.innerHTML = '👤';
}
document.getElementById('userAvatar').onclick = ()=> document.getElementById('userAvatarInput').click();
document.getElementById('userAvatarInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file, 200, 0.75);
    state.userAvatar = dataUrl;
    renderAvatar();
    saveData();
    showToast('头像已更新 ♡');
  }catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};

function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=h*(maxSize/w); w=maxSize; }
        else if(h>maxSize){ w=w*(maxSize/h); h=maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function catObj(id){ return state.categories.find(c=>c.id===id); }
function catName(id){ const c=catObj(id); return c ? c.name : '未分类'; }
function isStatusCategory(cat){ return cat && cat.name === '状态栏'; }
function getCategoryColor(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  return CAT_COLORS[idx >= 0 ? idx % CAT_COLORS.length : 0];
}
function iconAll(){
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2.5 L13.6 9.2 L20 12 L13.6 14.8 L12 21.5 L10.4 14.8 L4 12 L10.4 9.2 Z" fill="currentColor"/>
    <circle cx="19" cy="5" r="1.6" fill="currentColor"/>
  </svg>`;
}
function iconManage(){
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 7.5C3 6.67 3.67 6 4.5 6H9.5L11.5 8H19.5C20.33 8 21 8.67 21 9.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V7.5Z" fill="currentColor"/>
    <circle cx="8" cy="13" r="0.9" fill="#fff" opacity="0.7"/>
    <circle cx="12" cy="13" r="0.9" fill="#fff" opacity="0.7"/>
    <circle cx="16" cy="13" r="0.9" fill="#fff" opacity="0.7"/>
  </svg>`;
}
function iconRibbon(){
  return `<svg viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 1H14V18L8 14L2 18V1Z" fill="#fff"/>
  </svg>`;
}
function iconExpand(){
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="6" cy="12" r="1.6" fill="currentColor"/>
    <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
    <circle cx="18" cy="12" r="1.6" fill="currentColor"/>
  </svg>`;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const allTab = document.createElement('div');
  allTab.className = 'tab tab-all' + (state.activeTab==='all' ? ' active' : '');
  allTab.innerHTML = `<div class="tab-avatar">${iconAll()}</div><div class="tab-label">全部</div>`;
  allTab.onclick = ()=>{ state.activeTab='all'; renderAll(); };
  tabs.appendChild(allTab);

  state.categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (state.activeTab===cat.id ? ' active' : '');
    if (isStatusCategory(cat)) btn.classList.add('tab-status');
    const coverHtml = cat.cover ? `<img src="${cat.cover}" alt="">` : `<span class="letter">${cat.name ? cat.name.charAt(0) : '?'}</span>`;
    btn.innerHTML = `<div class="tab-avatar">${coverHtml}</div><div class="tab-label">${escapeHtml(cat.name)}</div>`;
    btn.onclick = ()=>{ state.activeTab=cat.id; renderAll(); };
    tabs.appendChild(btn);
  });

  const manageTab = document.createElement('div');
  manageTab.className = 'tab tab-manage';
  manageTab.innerHTML = `<div class="tab-avatar">${iconManage()}</div><div class="tab-label">管理</div>`;
  manageTab.onclick = openCatManage;
  tabs.appendChild(manageTab);
}

function renderFilterRow(){
  const wrap = document.getElementById('filterRow');
  if(!wrap) return;
  wrap.innerHTML = '';
  const options = [
    { id: 'edited', label: '最近编辑' },
    { id: 'created', label: '最近创建' },
    { id: 'favorite', label: '收藏' }
  ];
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (state.activeFilter===opt.id ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = ()=>{ state.activeFilter = opt.id; renderAll(); };
    wrap.appendChild(btn);
  });
}

function getFilteredCards(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = state.cards.filter(c=>{
    const matchTab = state.activeTab==='all' || c.categoryId===state.activeTab;
    const matchQ = !q || c.title.toLowerCase().includes(q) || c.content.toLowerCase().includes(q);
    return matchTab && matchQ;
  });
  if(state.activeFilter === 'favorite'){
    list = list.filter(c => c.pinned);
  }
  list.sort((a,b)=>{
    if ((b.pinned ? 1 : 0) !== (a.pinned ? 1 : 0)){
      return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    }
    if(state.activeFilter === 'created'){
      return (b.createdAt||b.updatedAt||0) - (a.createdAt||a.updatedAt||0);
    }
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return list;
}

function renderStack(){
  const stack = document.getElementById('stack');
  const list = getFilteredCards();
  if(list.length===0){
    stack.innerHTML = `<div class="empty"><div class="empty-emoji">🎀</div>空空如也<div class="empty-sub">点右下角 + 新建第一条记录吧</div></div>`;
    return;
  }
  stack.innerHTML = '';
  list.forEach(card=>{
    const el = document.createElement('div');
    el.className = 'entry' + (card.pinned ? ' pinned' : '');
    const cat = catObj(card.categoryId);
    const catColor = getCategoryColor(card.categoryId);
    let avatarContent;
    if (cat && cat.cover) avatarContent = `<img src="${cat.cover}" alt="">`;
    else avatarContent = cat ? cat.name.charAt(0) : '?';
    const date = card.updatedAt ? new Date(card.updatedAt).toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
    let excerpt = card.content || '';
    if (excerpt.length === 0) excerpt = '（无内容）';
    const isStatus = isStatusCategory(cat);
    const avatarBg = isStatus ? 'var(--status-bg)' : catColor;
    const avatarColor = isStatus ? 'var(--ink)' : '#fff';

    el.innerHTML = `
      ${card.pinned ? `<div class="entry-ribbon">${iconRibbon()}</div>` : ''}
      <div class="entry-avatar" style="background:${avatarBg}; color:${avatarColor};">${avatarContent}</div>
      <div class="entry-title">${escapeHtml(card.title || '（无标题）')}</div>
      <span class="cat-label" style="background:${catColor}; color:#444;">${catName(card.categoryId)}</span>
      <div class="entry-excerpt">${escapeHtml(excerpt)}</div>
      <div class="entry-footer">
        <span class="entry-date">${date}</span>
        <button class="entry-expand-btn">${iconExpand()}</button>
      </div>
    `;
    el.onclick = ()=> openDetailModal(card.id);
    stack.appendChild(el);
  });
}

function openDetailModal(cardId){
  const card = state.cards.find(c=>c.id===cardId);
  if(!card) return;
  currentDetailId = cardId;
  const cat = catObj(card.categoryId);
  const catColor = getCategoryColor(card.categoryId);
  const isStatus = isStatusCategory(cat);
  let avatarContent;
  if (cat && cat.cover) avatarContent = `<img src="${cat.cover}" alt="">`;
  else avatarContent = cat ? cat.name.charAt(0) : '?';
  const avatarBg = isStatus ? 'var(--status-bg)' : catColor;
  const avatarColor = isStatus ? 'var(--ink)' : '#fff';
  const date = card.updatedAt ? new Date(card.updatedAt).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';

  document.getElementById('detailHeaderHtml').innerHTML = `
    <div class="detail-avatar" style="background:${avatarBg}; color:${avatarColor};">${avatarContent}</div>
    <div>
      <div class="detail-title">${escapeHtml(card.title || '（无标题）')}</div>

function exportData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    guides: state.guides,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle,
    exportedAt: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toLocaleDateString('zh-CN').replace(/\//g,'-');
  a.href = url; a.download = `卡片档案备份_${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出备份 ♡');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.categories || !parsed.cards){ showToast('文件格式不正确'); return; }
      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state.categories = parsed.categories;
      state.cards = parsed.cards;
      state.guides = parsed.guides || [];
      if(parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if(parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if(parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
      state.activeTab = 'all';
      state.activeFilter = 'edited';
      state.activeGuide = state.guides.length > 0 ? state.guides[0].id : null;
      state.guideShowFav = false;
      currentDetailId = null;
      state.cards.forEach(c => {
        if (c.pinned === undefined) c.pinned = false;
        if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
      });
      state.guides.forEach(g => {
        (g.sections || []).forEach(s => {
          (s.items || []).forEach(it => {
            if (it.faved === undefined) it.faved = false;
            if (it.group === undefined) it.group = '';
          });
        });
      });
      saveData();
      renderAll();
      showToast('导入成功 ♡');
    }catch(err){ showToast('文件解析失败'); console.error(err); }
  };
  reader.onerror = () => showToast('文件读取失败');
  reader.readAsText(file);
}

/* ============ 剧情指导 ============ */
function stripChapterPrefix(s){
  return (s || '').replace(/^[一二三四五六七八九十百]+[、.．]\s*/, '').trim();
}

/* 新解析规则：严格识别条目名 */
function parseMarkdownOrText(text){
  const lines = text.split(/\r?\n/);
  let series = '';
  let guideTitle = '';
  const sections = [];
  let currentSection = null;
  let currentGroup = '';
  let currentItem = null;
  let firstNonEmptySeen = false;
  // 用于判断"前后是否空行"
  const isEmpty = (i) => (i < 0 || i >= lines.length || !lines[i].trim());

  function ensureSection(){
    if (!currentSection){
      currentSection = { id: uid(), title: '未分类', items: [] };
      sections.push(currentSection);
    }
  }
  function startItem(title){
    ensureSection();
    currentItem = { id: uid(), title, content: '', faved: false, group: currentGroup };
    currentSection.items.push(currentItem);
  }

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i];
    const trimmed = raw.trim();
    if (!trimmed) continue;

    // 忽略 md 列表项前缀
    const cleaned = trimmed.replace(/^[-*+]\s+/, '').replace(/^\d+\.\s+/, '');

    const h1 = trimmed.match(/^#\s+(.+)$/);
    const h2 = trimmed.match(/^##\s+(.+)$/);
    const h3 = trimmed.match(/^###\s+(.+)$/);
    const h4 = trimmed.match(/^####\s+(.+)$/);
    const bold = trimmed.match(/^\*\*(.+)\*\*$/);
    const cnNum = trimmed.match(/^([一二三四五六七八九十百]+)[、.．]\s*(.+)$/);

    if (!firstNonEmptySeen){
      firstNonEmptySeen = true;
      if (!h1 && !h2 && !h3 && !h4 && !bold && !cnNum){
        guideTitle = trimmed;
        continue;
      }
    }

    if (h1){
      const t = trimmed.replace(/^#\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim();
      if (!series) series = t;
      else if (!guideTitle) guideTitle = t;
      continue;
    }
    if (h2){
      currentSection = { id: uid(), title: trimmed.replace(/^##\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim(), items: [] };
      sections.push(currentSection);
      currentGroup = '';
      currentItem = null;
      continue;
    }
    if (h3){
      currentGroup = trimmed.replace(/^###\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim();
      currentItem = null;
      continue;
    }
    if (h4){
      startItem(trimmed.replace(/^####\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim());
      continue;
    }
    if (bold){
      startItem(trimmed.replace(/^\*\*(.+)\*\*$/, '$1').trim());
      continue;
    }
    if (cnNum){
      currentSection = { id: uid(), title: trimmed, items: [] };
      sections.push(currentSection);
      currentGroup = '';
      currentItem = null;
      continue;
    }

    // 新规则：普通文本行当条目标题的条件
    // 1. 长度 3-25 字符
    // 2. 没有中文标点（逗号、句号、问号、叹号、分号、冒号）
    // 3. 前面是空行或章节/子章节刚结束
    // 4. 上一行不能是条目正文（防止把正文第一句当标题）
    const isShort = cleaned.length >= 2 && cleaned.length <= 25;
    const noCnPunc = !/[。！？；：，、]/.test(cleaned);
    const prevEmptyOrBoundary = isEmpty(i-1) || (i > 0 && (lines[i-1].trim().match(/^#{1,4}\s+/) || lines[i-1].trim().match(/^([一二三四五六七八九十百]+)[、.．]/) || lines[i-1].trim().match(/^\*\*(.+)\*\*$/)));
    const lastItemHasContent = currentItem && currentItem.content && currentItem.content.length > 0;

    // 只有当前无条目，或上一个条目已有正文，才允许起新条目
    const canStartNew = !currentItem || (currentItem && currentItem.content);

    if (isShort && noCnPunc && prevEmptyOrBoundary && canStartNew){
      startItem(cleaned);
      continue;
    }

    // 其他情况：追加到当前条目正文
    if (currentItem){
      if (currentItem.content) currentItem.content += '\n' + trimmed;
      else currentItem.content = trimmed;
    } else if (!guideTitle){
      guideTitle = trimmed;
    }
  }

  let seriesName = series || '';
  if (!seriesName && guideTitle){
    const m = guideTitle.match(/[·\-—]\s*(.+)$/);
    if (m) seriesName = m[1].trim();
  }
  if (!seriesName) seriesName = '未命名篇章';
  if (!guideTitle) guideTitle = seriesName;

  return { id: uid(), title: guideTitle, series: seriesName, sections };
}

function currentGuide(){
  if (!state.activeGuide) return null;
  return state.guides.find(g => g.id === state.activeGuide) || null;
}

function countGuideFav(){
  let n = 0;
  state.guides.forEach(g => {
    g.sections.forEach(s => {
      s.items.forEach(it => { if (it.faved) n++; });
    });
  });
  return n;
}

/* 渲染左栏：篇章固定 + 章节跟随 */
function renderGuideLeft(){
  const left = document.getElementById('gLeft');
  left.innerHTML = '';

  // 收藏入口
  const favEntry = document.createElement('div');
  favEntry.className = 'guide-left-fav' + (state.guideShowFav ? ' active' : '');
  favEntry.innerHTML = `🌟 收藏`;
  favEntry.onclick = ()=>{ state.guideShowFav = true; renderGuideAll(); };
  left.appendChild(favEntry);

  if (state.guides.length > 0){
    // === 篇章分组 ===
    const pzGroup = document.createElement('div');
    pzGroup.className = 'guide-left-group';
    pzGroup.textContent = '篇 章';
    left.appendChild(pzGroup);

    state.guides.forEach(g => {
      const el = document.createElement('div');
      const isActive = !state.guideShowFav && g.id === state.activeGuide;
      el.className = 'guide-left-pianzhang' + (isActive ? ' active' : '');
      el.textContent = g.series;
      el.onclick = ()=>{
        state.guideShowFav = false;
        state.activeGuide = g.id;
        state.activeGuideSection = null;
        renderGuideAll();
      };
      left.appendChild(el);
    });

    // === 章节分组（只显示当前篇章的章节） ===
    const g = currentGuide();
    if (g && g.sections.length > 0 && !state.guideShowFav){
      const divider = document.createElement('div');
      divider.className = 'guide-left-divider';
      left.appendChild(divider);

      const zjGroup = document.createElement('div');
      zjGroup.className = 'guide-left-group';
      zjGroup.textContent = '章 节';
      left.appendChild(zjGroup);

      g.sections.forEach(sec => {
        const el = document.createElement('div');
        el.className = 'guide-left-zhangjie';
        if (state.activeGuideSection === sec.id) el.classList.add('active');
        el.textContent = stripChapterPrefix(sec.title);
        el.onclick = ()=>{
          state.activeGuideSection = sec.id;
          state.guideShowFav = false;
          renderGuideAll();
          const target = document.getElementById('gSec_' + sec.id);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        left.appendChild(el);
      });
    }
  }

  // 管理
  const manage = document.createElement('div');
  manage.className = 'guide-left-manage';
  manage.textContent = '⚙️ 管理';
  manage.onclick = openGuideManage;
  left.appendChild(manage);
}

/* 渲染右侧：显示章节标题（粉色大字） */
function renderGuideRight(){
  const right = document.getElementById('gRight');
  right.innerHTML = '';

  // 收藏模式
  if (state.guideShowFav){
    const favs = [];
    state.guides.forEach(g => {
      g.sections.forEach(s => {
        s.items.forEach(it => {
          if (it.faved) favs.push({ guide: g, section: s, item: it });
        });
      });
    });
    if (favs.length === 0){
      right.innerHTML = `<div class="guide-empty">
        <div class="guide-empty-emoji">🌟</div>
        还没有收藏任何条目
        <div class="guide-empty-sub">打开条目点"☆ 收藏"</div>
      </div>`;
      return;
    }
    favs.forEach(({guide, section, item}) => {
      const card = document.createElement('div');
      card.className = 'guide-fav-card';
      card.innerHTML = `
        <div class="guide-fav-title"><span class="s">★</span>${escapeHtml(item.title)}</div>
        <div class="guide-fav-meta">${escapeHtml(guide.series)} · ${escapeHtml(section.title)}${item.group ? ' · ' + escapeHtml(item.group) : ''}</div>
      `;
      card.onclick = ()=> openGuideItem(guide.id, section.id, item.id);
      right.appendChild(card);
    });
    return;
  }

  const g = currentGuide();
  if (!g){
    right.innerHTML = `<div class="guide-empty">
      <div class="guide-empty-emoji">📚</div>
      还没有剧情指导
      <div class="guide-empty-sub">点左下方"⚙️ 管理"导入 md 或 txt</div>
    </div>`;
    return;
  }

  // 只显示当前选中章节（如果有），或全部章节
  let sectionsToShow = g.sections;
  if (state.activeGuideSection){
    const s = g.sections.find(x => x.id === state.activeGuideSection);
    if (s) sectionsToShow = [s];
  }

  sectionsToShow.forEach(sec => {
    const secWrap = document.createElement('div');
    secWrap.id = 'gSec_' + sec.id;

    // 章节标题（粉色大字）
    const titleEl = document.createElement('div');
    titleEl.className = 'guide-right-chapter-title';
    titleEl.textContent = sec.title;
    secWrap.appendChild(titleEl);

    // 条目列表（按 group 分组）
    let lastGroup = null;
    sec.items.forEach(item => {
      if (item.group && item.group !== lastGroup){
        const grp = document.createElement('div');
        grp.className = 'guide-right-group';
        grp.textContent = item.group;
        secWrap.appendChild(grp);
        lastGroup = item.group;
      }
      const el = document.createElement('div');
      el.className = 'guide-right-item' + (item.faved ? ' faved' : '');
      el.innerHTML = `<span class="s">${item.faved ? '★' : '·'}</span><span class="t">${escapeHtml(item.title)}</span>`;
      el.onclick = ()=> openGuideItem(g.id, sec.id, item.id);
      secWrap.appendChild(el);
    });

    right.appendChild(secWrap);
  });
}

function renderGuideAll(){
  renderGuideTop();
  renderGuideLeft();
  renderGuideRight();
  renderGuideCount();
}

function renderGuideTop(){
  const titleEl = document.getElementById('gTopTitle');
  const subEl = document.getElementById('gTopSub');
  const favBtn = document.getElementById('gTopFavBtn');

  if (state.guideShowFav){
    titleEl.textContent = '🌟 收藏';
    const n = countGuideFav();
    subEl.textContent = n + ' 条目';
  } else {
    const g = currentGuide();
    if (!g){
      titleEl.textContent = '剧情指导';
      subEl.textContent = '还没有导入';
    } else {
      titleEl.textContent = g.series;
      // 只统计当前篇章
      let itemCount = 0;
      let chapterCount = g.sections.length;
      g.sections.forEach(sec => { itemCount += sec.items.length; });
      subEl.textContent = chapterCount + ' 章节 · ' + itemCount + ' 条目';
    }
  }
  favBtn.textContent = '🌟 收藏 ' + countGuideFav();
}

function renderGuideCount(){
  if (state.currentMode === 'guide'){
    let total = 0;
    state.guides.forEach(g => {
      g.sections.forEach(s => { total += s.items.length; });
    });
    document.getElementById('countLabel').textContent = total + ' 条';
  }
}

document.getElementById('gTopFavBtn').onclick = ()=>{
  state.guideShowFav = true;
  renderGuideAll();
};

/* 条目详情 */
function openGuideItem(guideId, sectionId, itemId){
  const guide = state.guides.find(g => g.id === guideId);
  if (!guide) return;
  const section = guide.sections.find(s => s.id === sectionId);
  if (!section) return;
  const item = section.items.find(i => i.id === itemId);
  if (!item) return;

  currentGuideItem = { guideId, sectionId, itemId };
  const meta = `${guide.series} · ${section.title}${item.group ? ' · ' + item.group : ''}`;
  document.getElementById('gDetailTitle').textContent = item.title;
  document.getElementById('gDetailMeta').textContent = meta;
  document.getElementById('gDetailContent').textContent = item.content || '（暂无正文）';
  const favBtn = document.getElementById('gDetailFavBtn');
  favBtn.textContent = item.faved ? '★ 已收藏' : '☆ 收藏';
  document.getElementById('guideItemOverlay').classList.add('show');
}
function closeGuideItem(){
  document.getElementById('guideItemOverlay').classList.remove('show');
  currentGuideItem = null;
}
document.getElementById('guideItemOverlay').onclick = (e)=>{ if(e.target.id==='guideItemOverlay') closeGuideItem(); };
document.getElementById('gDetailCloseBtn').onclick = closeGuideItem;
document.getElementById('gDetailFavBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);
  const item = section.items.find(i => i.id === currentGuideItem.itemId);
  item.faved = !item.faved;
  saveData();
  document.getElementById('gDetailFavBtn').textContent = item.faved ? '★ 已收藏' : '☆ 收藏';
  renderGuideAll();
  showToast(item.faved ? '已收藏 ♡' : '已取消收藏');
};

/* 编辑条目 */
document.getElementById('gDetailEditBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);

  editingGuideItem = currentGuideItem;
  document.getElementById('gEditTitle').value = item.title;
  document.getElementById('gEditContent').value = item.content;
  document.getElementById('guideItemOverlay').classList.remove('show');
  document.getElementById('guideEditOverlay').classList.add('show');
};
document.getElementById('gEditCancelBtn').onclick = ()=>{
  document.getElementById('guideEditOverlay').classList.remove('show');
  editingGuideItem = null;
};
document.getElementById('gEditSaveBtn').onclick = ()=>{
  if (!editingGuideItem) return;
  const guide = state.guides.find(g => g.id === editingGuideItem.guideId);
  const section = guide.sections.find(s => s.id === editingGuideItem.sectionId);
  const item = section.items.find(i => i.id === editingGuideItem.itemId);
  const newTitle = document.getElementById('gEditTitle').value.trim();
  const newContent = document.getElementById('gEditContent').value.trim();
  if (!newTitle){ showToast('标题不能为空'); return; }
  item.title = newTitle;
  item.content = newContent;
  saveData();
  document.getElementById('guideEditOverlay').classList.remove('show');
  editingGuideItem = null;
  renderGuideAll();
  showToast('已保存 ♡');
};
document.getElementById('guideEditOverlay').onclick = (e)=>{ if(e.target.id==='guideEditOverlay') document.getElementById('guideEditOverlay').classList.remove('show'); };

/* 删除条目 */
document.getElementById('gDetailDelBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  if (!confirm('确定删除这条剧情吗？此操作无法撤销。')) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);
  section.items = section.items.filter(i => i.id !== currentGuideItem.itemId);
  saveData();
  closeGuideItem();
  renderGuideAll();
  showToast('已删除');
};

/* 管理剧情指导 */
function openGuideManage(){
  renderGuideManageList();
  document.getElementById('guideManageOverlay').classList.add('show');
}
function closeGuideManage(){ document.getElementById('guideManageOverlay').classList.remove('show'); }
function renderGuideManageList(){
  const list = document.getElementById('guideManageList');
  list.innerHTML = '';
  if (state.guides.length === 0){
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--ink-soft);font-size:13px;">还没有导入任何剧情指导</div>`;
    return;
  }
  state.guides.forEach(g => {
    const totalItems = g.sections.reduce((s, sec) => s + sec.items.length, 0);
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    row.innerHTML = `
      <div class="cover-preview" style="background:var(--theme-soft);color:var(--theme);font-weight:700;">🎬</div>
      <div class="cat-manage-name">
        ${escapeHtml(g.series)}
        <div style="font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:2px;">${g.sections.length} 章节 · ${totalItems} 条目</div>
      </div>
      <div class="cat-manage-actions">
        <button class="icon-btn rename-guide" title="重命名">✎</button>
        <button class="icon-btn del del-guide" title="删除">✕</button>
      </div>
    `;
    row.querySelector('.rename-guide').onclick = ()=> openGuideRename(g.id);
    row.querySelector('.del-guide').onclick = ()=> deleteGuide(g.id);
    list.appendChild(row);
  });
}
function deleteGuide(id){
  const g = state.guides.find(g => g.id === id);
  if (!g) return;
  if (!confirm(`确定删除「${g.series}」吗？它下面的所有章节和条目都会一并删除。`)) return;
  state.guides = state.guides.filter(g => g.id !== id);
  if (state.activeGuide === id){
    state.activeGuide = state.guides.length > 0 ? state.guides[0].id : null;
    state.activeGuideSection = null;
  }
  saveData();
  renderGuideManageList();
  renderGuideAll();
  showToast('已删除');
}

/* 重命名篇章 */
function openGuideRename(id){
  const g = state.guides.find(g => g.id === id);
  if (!g) return;
  renamingGuideId = id;
  document.getElementById('gRenameInput').value = g.series;
  document.getElementById('guideRenameOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('gRenameInput').focus(), 100);
}
document.getElementById('gRenameCancelBtn').onclick = ()=>{
  document.getElementById('guideRenameOverlay').classList.remove('show');
  renamingGuideId = null;
};
document.getElementById('gRenameSaveBtn').onclick = ()=>{
  if (!renamingGuideId) return;
  const g = state.guides.find(g => g.id === renamingGuideId);
  const name = document.getElementById('gRenameInput').value.trim();
  if (!name){ showToast('名称不能为空'); return; }
  g.series = name;
  saveData();
  document.getElementById('guideRenameOverlay').classList.remove('show');
  renamingGuideId = null;
  renderGuideManageList();
  renderGuideAll();
  showToast('已重命名 ♡');
};
document.getElementById('guideRenameOverlay').onclick = (e)=>{ if(e.target.id==='guideRenameOverlay') document.getElementById('guideRenameOverlay').classList.remove('show'); };

/* 导入 */
document.getElementById('guideImportBtn').onclick = ()=> document.getElementById('guideImportInput').click();
document.getElementById('guideImportInput').onchange = (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const text = ev.target.result;
      const guide = parseMarkdownOrText(text);
      pendingImport = guide;
      renderGuidePreview(guide, file.name);
      document.getElementById('guidePreviewOverlay').classList.add('show');
    }catch(err){
      showToast('解析失败');
      console.error(err);
    }
  };
  reader.onerror = ()=> showToast('文件读取失败');
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
};

function renderGuidePreview(guide, fileName){
  const body = document.getElementById('guidePreviewBody');
  const totalItems = guide.sections.reduce((s, sec) => s + sec.items.length, 0);
  let groupsCount = 0;
  guide.sections.forEach(sec => {
    const groups = new Set();
    sec.items.forEach(it => { if (it.group) groups.add(it.group); });
    groupsCount += groups.size;
  });
  body.innerHTML = `
    <div class="import-preview">
      <div class="import-preview-row"><span class="k">文件</span><span class="v">${escapeHtml(fileName || '')}</span></div>
      <div class="import-preview-row"><span class="k">指导集</span><span class="v">${escapeHtml(guide.title)}</span></div>
      <div class="import-preview-row"><span class="k">篇章名</span><span class="v">${escapeHtml(guide.series)}</span></div>
      <div class="import-preview-row"><span class="k">章节数</span><span class="v">${guide.sections.length}</span></div>
      ${groupsCount ? `<div class="import-preview-row"><span class="k">子章节数</span><span class="v">${groupsCount}</span></div>` : ''}
      <div class="import-preview-row"><span class="k">条目数</span><span class="v">${totalItems}</span></div>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);line-height:1.7;padding:4px 4px 0;">
      前 3 个章节预览：<br>
      ${guide.sections.slice(0, 3).map(s => '· ' + escapeHtml(s.title) + ' (' + s.items.length + ' 条)').join('<br>')}
    </div>
  `;
}

document.getElementById('guidePreviewCancelBtn').onclick = ()=>{
  document.getElementById('guidePreviewOverlay').classList.remove('show');
  pendingImport = null;
};
document.getElementById('guidePreviewConfirmBtn').onclick = ()=>{
  if (!pendingImport) return;
  const exist = state.guides.find(g => g.series === pendingImport.series);
  if (exist){
    if (!confirm(`已存在「${pendingImport.series}」，是否覆盖？`)) return;
    state.guides = state.guides.filter(g => g.id !== exist.id);
  }
  state.guides.push(pendingImport);
  state.activeGuide = pendingImport.id;
  state.activeGuideSection = null;
  state.guideShowFav = false;
  saveData();
  document.getElementById('guidePreviewOverlay').classList.remove('show');
  pendingImport = null;
  closeGuideManage();
  renderGuideAll();
  showToast('导入成功 ♡');
};

document.getElementById('guideManageCloseBtn').onclick = closeGuideManage;
document.getElementById('guideManageOverlay').onclick = (e)=>{ if(e.target.id==='guideManageOverlay') closeGuideManage(); };

/* 模式切换 */
function switchMode(mode){
  state.currentMode = mode;
  document.getElementById('modeBtnCard').classList.toggle('active', mode === 'card');
  document.getElementById('modeBtnGuide').classList.toggle('active', mode === 'guide');
  document.getElementById('cardView').style.display = mode === 'card' ? 'block' : 'none';
  document.getElementById('guideView').style.display = mode === 'guide' ? 'block' : 'none';
  document.getElementById('fabAdd').style.display = mode === 'card' ? 'flex' : 'none';
  updateCountLabel();
}
document.getElementById('modeBtnCard').onclick = ()=> switchMode('card');
document.getElementById('modeBtnGuide').onclick = ()=> switchMode('guide');

function updateCountLabel(){
  if (state.currentMode === 'guide'){
    renderGuideCount();
  } else {
    const list = getFilteredCards();
    document.getElementById('countLabel').textContent = list.length + ' 条';
  }
}

document.getElementById('fabAdd').onclick = openAddModal;
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = saveEntry;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
document.getElementById('catManageCloseBtn').onclick = closeCatManage;
document.getElementById('catManageOverlay').onclick = (e)=>{ if(e.target.id==='catManageOverlay') closeCatManage(); };
document.getElementById('catAddNewBtn').onclick = ()=> openCatModal(null);
document.getElementById('catCancelBtn').onclick = closeCatModal;
document.getElementById('catSaveBtn').onclick = saveCategory;
document.getElementById('catOverlay').onclick = (e)=>{ if(e.target.id==='catOverlay') closeCatModal(); };
document.getElementById('uploadCoverBtn').onclick = ()=> document.getElementById('coverFileInput').click();
document.getElementById('clearCoverBtn').onclick = ()=>{ pendingCoverData = null; updateCoverPreview(); };
document.getElementById('coverFileInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{ pendingCoverData = await compressImage(file, 200, 0.75); updateCoverPreview(); }
  catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};
document.getElementById('searchInput').oninput = renderAll;
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFileInput').click();
document.getElementById('importFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  importData(file);
  e.target.value = '';
};

function renderAll(){
  renderTitle();
  renderAvatar();
  renderTabs();
  renderFilterRow();
  renderStack();
  renderGuideAll();
  updateCountLabel();
}

loadData();
</script>
</body>
</html>
