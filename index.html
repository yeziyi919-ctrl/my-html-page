<script>
const STORAGE_KEY = 'card-archive-data-v4';
const CAT_COLORS = ['#f2d4f6','#fae29c','#cde6fc','#ddefe3','#d3defb'];

let state = {
  categories: [
    { id: 'mask', name: '面具', cover: null },
    { id: 'npc', name: 'NPC', cover: null },
    { id: 'status', name: '状态栏', cover: null },
    { id: 'cmd', name: '指令', cover: null },
    { id: 'extra', name: '番外', cover: null }
  ],
  cards: [],
  guides: [],
  activeTab: 'all',
  activeFilter: 'edited',
  activeGuide: null,
  activeGuideSection: null,
  guideShowFav: false,
  userAvatar: null,
  mainTitle: '卡片档案',
  subtitle: 'my little',
  currentMode: 'card'
};

let currentDetailId = null;
let editingId = null;
let editingCatId = null;
let pendingCoverData = null;
let pendingImport = null;
let currentGuideItem = null;
let editingGuideItem = null;
let renamingGuideId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function $(id){ return document.getElementById(id); }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1600);
}
function copyText(text, btnEl){
  const doCopy = async ()=>{
    try { await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  };
  doCopy().then(()=>{
    showToast('已复制 ♡');
    if(btnEl){
      btnEl.classList.add('done');
      const orig = btnEl.textContent;
      btnEl.textContent = '已复制 ✓';
      setTimeout(()=>{
        btnEl.classList.remove('done');
        btnEl.textContent = orig;
      }, 1200);
    }
  });
}
function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = h * (maxSize / w); w = maxSize; }
        else if(h > maxSize){ w = w * (maxSize / h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms))]);
}
function hasClaudeStorage(){
  return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
}
function hasLocalStorage(){
  try { const t = '__' + Date.now(); localStorage.setItem(t, '1'); localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
async function loadData(){
  let raw = null;
  if(hasClaudeStorage()){
    try { const res = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000); if(res && res.value) raw = res.value; } catch(e){}
  }
  if(raw === null && hasLocalStorage()){
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){}
  }
  if(raw){
    try {
      const parsed = JSON.parse(raw);
      if(parsed.categories) state.categories = parsed.categories;
      if(parsed.cards) state.cards = parsed.cards;
      if(parsed.guides) state.guides = parsed.guides;
      if(parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if(parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if(parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
    } catch(e){}
  }
  state.cards.forEach(c => {
    if (c.pinned === undefined) c.pinned = false;
    if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
  });
  (state.guides || []).forEach(g => {
    (g.sections || []).forEach(s => {
      (s.items || []).forEach(it => {
        if (it.faved === undefined) it.faved = false;
        if (it.group === undefined) it.group = '';
      });
    });
  });
  if (state.guides.length > 0 && !state.activeGuide){
    state.activeGuide = state.guides[0].id;
  }
  renderAll();
}
async function saveData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    guides: state.guides,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle
  });
  let ok = false;
  if(hasClaudeStorage()){
    try { await withTimeout(window.storage.set(STORAGE_KEY, payload, false), 5000); ok = true; } catch(e){}
  }
  if(hasLocalStorage()){
    try { localStorage.setItem(STORAGE_KEY, payload); ok = true; } catch(e){}
  }
  if(!ok) showToast('⚠️ 保存失败！请导出备份');
}

function catObj(id){ return state.categories.find(c => c.id === id); }
function catName(id){ const c = catObj(id); return c ? c.name : '未分类'; }
function isStatusCategory(cat){ return cat && cat.name === '状态栏'; }
function getCategoryColor(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  return CAT_COLORS[idx >= 0 ? idx % CAT_COLORS.length : 0];
}

function renderTitle(){
  const titleEl = $('titleDisplay');
  const subEl = $('subtitleDisplay');
  const countEl = $('countDisplay');
  titleEl.textContent = state.mainTitle || '卡片档案';
  subEl.textContent = state.subtitle || 'my little';
  const list = getFilteredCards();
  countEl.textContent = list.length + ' 条';
}
function renderAvatar(){
  const el = $('userAvatar');
  if (state.userAvatar) el.innerHTML = `<img src="${state.userAvatar}" alt="avatar">`;
  else el.innerHTML = '👤';
}

function renderTabs(){
  const wrap = $('catRow');
  wrap.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'cat' + (state.activeTab === 'all' ? ' active' : '');
  allBtn.textContent = '全部';
  allBtn.onclick = ()=>{ state.activeTab = 'all'; renderAll(); };
  wrap.appendChild(allBtn);

  state.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat' + (state.activeTab === cat.id ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = ()=>{ state.activeTab = cat.id; renderAll(); };
    wrap.appendChild(btn);
  });

  const manageBtn = document.createElement('button');
  manageBtn.className = 'cat';
  manageBtn.textContent = '⚙ 管理';
  manageBtn.onclick = openCatManage;
  wrap.appendChild(manageBtn);
}

function renderFilterRow(){
  const wrap = $('filterRow');
  wrap.innerHTML = '';
  const options = [
    { id: 'edited', label: '最近编辑' },
    { id: 'created', label: '最近创建' },
    { id: 'favorite', label: '收藏' }
  ];
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (state.activeFilter === opt.id ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = ()=>{ state.activeFilter = opt.id; renderAll(); };
    wrap.appendChild(btn);
  });
}

function getFilteredCards(){
  const q = ($('searchInput').value || '').trim().toLowerCase();
  let list = state.cards.filter(c => {
    const matchTab = state.activeTab === 'all' || c.categoryId === state.activeTab;
    const matchQ = !q ||
      (c.title || '').toLowerCase().includes(q) ||
      (c.content || '').toLowerCase().includes(q);
    return matchTab && matchQ;
  });
  if (state.activeFilter === 'favorite') list = list.filter(c => c.pinned);
  list.sort((a,b) => {
    if ((b.pinned ? 1 : 0) !== (a.pinned ? 1 : 0)){
      return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    }
    if (state.activeFilter === 'created'){
      return (b.createdAt || b.updatedAt || 0) - (a.createdAt || a.updatedAt || 0);
    }
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  return list;
}

      : '<path d="M12 3.8l2.4 5 5.5.8-4 3.9.9 5.5L12 16.5l-4.8 2.5.9-5.5-4-3.9 5.5-.8L12 3.8z" stroke="currentColor" stroke-width="1.8" fill="none"/>';

function exportData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    guides: state.guides,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle,
    exportedAt: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toLocaleDateString('zh-CN').replace(/\//g,'-');
  a.href = url;
  a.download = `卡片档案备份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出备份 ♡');
}
function importData(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.categories || !parsed.cards){ showToast('文件格式不正确'); return; }
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state.categories = parsed.categories;
      state.cards = parsed.cards;
      state.guides = parsed.guides || [];
      if (parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if (parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if (parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
      state.activeTab = 'all';
      state.activeFilter = 'edited';
      state.activeGuide = state.guides.length > 0 ? state.guides[0].id : null;
      state.guideShowFav = false;
      state.activeGuideSection = null;
      currentDetailId = null;
      state.cards.forEach(c => {
        if (c.pinned === undefined) c.pinned = false;
        if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
      });
      state.guides.forEach(g => {
        (g.sections || []).forEach(s => {
          (s.items || []).forEach(it => {
            if (it.faved === undefined) it.faved = false;
            if (it.group === undefined) it.group = '';
          });
        });
      });
      saveData();
      renderAll();
      showToast('导入成功 ♡');
    } catch(err){
      showToast('文件解析失败');
      console.error(err);
    }
  };
  reader.onerror = ()=> showToast('文件读取失败');
  reader.readAsText(file);
}

function stripChapterPrefix(s){
  return (s || '').replace(/^[一二三四五六七八九十百]+[、.．]\s*/, '').trim();
}

function parseMarkdownOrText(text){
  const lines = text.split(/\r?\n/);
  let series = '';
  let guideTitle = '';
  const sections = [];
  let currentSection = null;
  let currentGroup = '';
  let currentItem = null;
  let firstNonEmptySeen = false;
  const isEmpty = (i) => (i < 0 || i >= lines.length || !lines[i].trim());

  function ensureSection(){
    if (!currentSection){
      currentSection = { id: uid(), title: '未分类', items: [] };
      sections.push(currentSection);
    }
  }
  function startItem(title){
    ensureSection();
    currentItem = { id: uid(), title, content: '', faved: false, group: currentGroup };
    currentSection.items.push(currentItem);
  }

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i];
    const trimmed = raw.trim();
    if (!trimmed) continue;

    const cleaned = trimmed.replace(/^[-*+]\s+/, '').replace(/^\d+\.\s+/, '');
    const h1 = trimmed.match(/^#\s+(.+)$/);
    const h2 = trimmed.match(/^##\s+(.+)$/);
    const h3 = trimmed.match(/^###\s+(.+)$/);
    const h4 = trimmed.match(/^####\s+(.+)$/);
    const bold = trimmed.match(/^\*\*(.+)\*\*$/);
    const cnNum = trimmed.match(/^([一二三四五六七八九十百]+)[、.．]\s*(.+)$/);

    if (!firstNonEmptySeen){
      firstNonEmptySeen = true;
      if (!h1 && !h2 && !h3 && !h4 && !bold && !cnNum){
        guideTitle = trimmed;
        continue;
      }
    }

    if (h1){
      const t = trimmed.replace(/^#\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim();
      if (!series) series = t;
      else if (!guideTitle) guideTitle = t;
      continue;
    }
    if (h2){
      currentSection = {
        id: uid(),
        title: trimmed.replace(/^##\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim(),
        items: []
      };
      sections.push(currentSection);
      currentGroup = '';
      currentItem = null;
      continue;
    }
    if (h3){
      currentGroup = trimmed.replace(/^###\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim();
      currentItem = null;
      continue;
    }
    if (h4){
      startItem(trimmed.replace(/^####\s+/, '').replace(/^\*\*(.+)\*\*$/, '$1').trim());
      continue;
    }
    if (bold){
      startItem(trimmed.replace(/^\*\*(.+)\*\*$/, '$1').trim());
      continue;
    }
    if (cnNum){
      currentSection = { id: uid(), title: trimmed, items: [] };
      sections.push(currentSection);
      currentGroup = '';
      currentItem = null;
      continue;
    }

    const isShort = cleaned.length >= 2 && cleaned.length <= 25;
    const noCnPunc = !/[。！？；：，、]/.test(cleaned);
    const prevEmptyOrBoundary = isEmpty(i-1) || (i > 0 && (
      lines[i-1].trim().match(/^#{1,4}\s+/) ||
      lines[i-1].trim().match(/^([一二三四五六七八九十百]+)[、.．]/) ||
      lines[i-1].trim().match(/^\*\*(.+)\*\*$/)
    ));
    const canStartNew = !currentItem || (currentItem && currentItem.content);

    if (isShort && noCnPunc && prevEmptyOrBoundary && canStartNew){
      startItem(cleaned);
      continue;
    }

    if (currentItem){
      if (currentItem.content) currentItem.content += '\n' + trimmed;
      else currentItem.content = trimmed;
    } else if (!guideTitle){
      guideTitle = trimmed;
    }
  }

  let seriesName = series || '';
  if (!seriesName && guideTitle){
    const m = guideTitle.match(/[·\-—]\s*(.+)$/);
    if (m) seriesName = m[1].trim();
  }
  if (!seriesName) seriesName = guideTitle || '未命名篇章';
  if (!guideTitle) guideTitle = seriesName;

  return { id: uid(), title: guideTitle, series: seriesName, sections };
}

function currentGuide(){
  if (!state.activeGuide) return null;
  return state.guides.find(g => g.id === state.activeGuide) || null;
}
function countGuideFav(){
  let n = 0;
  state.guides.forEach(g => {
    (g.sections || []).forEach(s => {
      (s.items || []).forEach(it => { if (it.faved) n++; });
    });
  });
  return n;
}

  state.guides.forEach(g => {
    const btn = document.createElement('button');

      state.activeGuide = g.id;
      state.activeGuideSection = null;
      state.guideShowFav = false;

function renderGuideLeft(){
  const left = $('chapterList');
  left.innerHTML = '';

  const inner = document.createElement('div');
  inner.className = 'guide-chapters-inner';
  left.appendChild(inner);

  if (state.guideShowFav) return;

  const g = currentGuide();
  if (!g || !g.sections.length) return;

  g.sections.forEach(sec => {
    const el = document.createElement('div');
    el.className = 'chapter-item' + (state.activeGuideSection === sec.id ? ' active' : '');
    el.textContent = stripChapterPrefix(sec.title);
    el.onclick = ()=>{
      inner.querySelectorAll('.chapter-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      state.activeGuideSection = sec.id;
      renderGuideRight();
      const rightEl = $('guideContent');
      if (rightEl) rightEl.scrollTop = 0;
    };
    inner.appendChild(el);
  });
}

function renderGuideRight(){
  const right = $('guideContent');
  right.innerHTML = '';

  if (state.guideShowFav){
    const favs = [];
    state.guides.forEach(g => {
      (g.sections || []).forEach(s => {
        (s.items || []).forEach(it => {
          if (it.faved) favs.push({ guide: g, section: s, item: it });
        });
      });
    });
    if (favs.length === 0){
      right.innerHTML = `<div class="guide-empty">
        <div class="guide-empty-emoji">🌟</div>
        还没有收藏任何条目
        <div class="guide-empty-sub">打开条目点"☆ 收藏"</div>
      </div>`;
      return;
    }
    favs.forEach(({guide, section, item}) => {
      const card = document.createElement('div');
      card.className = 'guide-fav-card';
      card.innerHTML = `
        <div class="guide-fav-title"><span class="s">★</span>${escapeHtml(item.title)}</div>
        <div class="guide-fav-meta">${escapeHtml(guide.series)} · ${escapeHtml(section.title)}${item.group ? ' · ' + escapeHtml(item.group) : ''}</div>
      `;
      card.onclick = ()=> openGuideItem(guide.id, section.id, item.id);
      right.appendChild(card);
    });
    return;
  }

  const g = currentGuide();
  if (!g){
    right.innerHTML = `<div class="guide-empty">
      <div class="guide-empty-emoji">📚</div>
      还没有剧情指导
      <div class="guide-empty-sub">点右下角 + 导入 md / txt</div>
    </div>`;
    return;
  }

  let sectionsToShow = g.sections;
  if (state.activeGuideSection){
    const s = g.sections.find(x => x.id === state.activeGuideSection);
    if (s) sectionsToShow = [s];
  }

  sectionsToShow.forEach(sec => {
    const secWrap = document.createElement('div');

    const head = document.createElement('div');
    head.className = 'guide-section-head';
    head.innerHTML = `
      <div class="eyebrow">STORY GUIDE · ${escapeHtml(g.series)}</div>
      <div class="title">${escapeHtml(sec.title)}</div>
    `;
    secWrap.appendChild(head);

    let lastGroup = null;
    (sec.items || []).forEach(item => {
      if (item.group && item.group !== lastGroup){
        const grp = document.createElement('div');
        grp.className = 'guide-right-group';
        grp.textContent = item.group;
        secWrap.appendChild(grp);
        lastGroup = item.group;
      }

      const el = document.createElement('div');
      el.className = 'guide-item' + (item.faved ? ' faved' : '');
      el.innerHTML = `
        <div class="guide-item__glow"></div>
        <div class="guide-item__shine"></div>
        <div class="guide-item__body">
          <div class="guide-item__title">${escapeHtml(item.title)}</div>
          <div class="guide-item__excerpt">${escapeHtml(item.content || '')}</div>
        </div>
        <div class="guide-item__fav${item.faved ? ' on' : ''}">★</div>
      `;
      el.onclick = (e) => {
        if (e.target.closest('.guide-item__fav')) {
          e.stopPropagation();
          item.faved = !item.faved;
          saveData();
          renderGuideAll();
          showToast(item.faved ? '已收藏 ♡' : '已取消收藏');
          return;
        }
        openGuideItem(g.id, sec.id, item.id);
      };
      secWrap.appendChild(el);
    });

    right.appendChild(secWrap);
  });
}

function renderGuideAll(){
  renderGuideTabs();
  renderGuideLeft();
  renderGuideRight();

function openGuideItem(guideId, sectionId, itemId){
  const guide = state.guides.find(g => g.id === guideId);

  const section = guide.sections.find(s => s.id === sectionId);
  if (!section) return;
  const item = section.items.find(i => i.id === itemId);
  if (!item) return;

  currentGuideItem = { guideId, sectionId, itemId };
  const meta = `${guide.series} · ${section.title}${item.group ? ' · ' + item.group : ''}`;
  $('gDetailTitle').textContent = item.title;
  $('gDetailMeta').textContent = meta;
  $('gDetailContent').textContent = item.content || '（暂无正文）';
  $('gDetailFavBtn').textContent = item.faved ? '★ 已收藏' : '☆ 收藏';
  $('guideItemOverlay').classList.add('show');
}

  list.innerHTML = '';
  if (state.guides.length === 0){
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px;">还没有导入任何剧情指导</div>`;
    return;
  }
  state.guides.forEach(g => {
    const totalItems = (g.sections || []).reduce((s, sec) => s + (sec.items || []).length, 0);
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    row.innerHTML = `
      <div class="cover-preview" style="background:var(--purple-soft);color:var(--purple-2);">🎬</div>
      <div class="cat-manage-name">
        ${escapeHtml(g.series)}
        <div class="sub">${g.sections.length} 章节 · ${totalItems} 条目</div>
      </div>
      <div class="cat-manage-actions">
        <button class="icon-btn rename-guide" title="重命名">✎</button>
        <button class="icon-btn del del-guide" title="删除">✕</button>
      </div>
    `;
    row.querySelector('.rename-guide').onclick = ()=> openGuideRename(g.id);
    row.querySelector('.del-guide').onclick = ()=> deleteGuide(g.id);
    list.appendChild(row);
  });
}
function deleteGuide(id){
  const g = state.guides.find(x => x.id === id);
  if (!g) return;
  if (!confirm(`确定删除「${g.series}」吗？它下面的所有章节和条目都会一并删除。`)) return;
  state.guides = state.guides.filter(x => x.id !== id);
  if (state.activeGuide === id){
    state.activeGuide = state.guides.length > 0 ? state.guides[0].id : null;
    state.activeGuideSection = null;
  }
  saveData();
  renderGuideManageList();
  renderGuideAll();
  showToast('已删除');
}
function openGuideRename(id){
  const g = state.guides.find(x => x.id === id);
  if (!g) return;
  renamingGuideId = id;
  $('gRenameInput').value = g.series;
  $('guideRenameOverlay').classList.add('show');
  setTimeout(()=> $('gRenameInput').focus(), 200);
}

function renderGuidePreview(guide, fileName){
  const body = $('guidePreviewBody');
  const totalItems = (guide.sections || []).reduce((s, sec) => s + (sec.items || []).length, 0);
  let groupsCount = 0;
  guide.sections.forEach(sec => {
    const groups = new Set();
    (sec.items || []).forEach(it => { if (it.group) groups.add(it.group); });
    groupsCount += groups.size;
  });
  body.innerHTML = `
    <div class="import-preview">
      <div class="import-preview-row"><span class="k">文件</span><span class="v">${escapeHtml(fileName || '')}</span></div>
      <div class="import-preview-row"><span class="k">指导集</span><span class="v">${escapeHtml(guide.title)}</span></div>
      <div class="import-preview-row"><span class="k">篇章名</span><span class="v">${escapeHtml(guide.series)}</span></div>
      <div class="import-preview-row"><span class="k">章节数</span><span class="v">${guide.sections.length}</span></div>
      ${groupsCount ? `<div class="import-preview-row"><span class="k">子章节数</span><span class="v">${groupsCount}</span></div>` : ''}
      <div class="import-preview-row"><span class="k">条目数</span><span class="v">${totalItems}</span></div>
    </div>
    <div style="font-size:12px;color:var(--ink-2);line-height:1.7;padding:4px 4px 0;">
      前 3 个章节预览：<br>
      ${guide.sections.slice(0, 3).map(s => '· ' + escapeHtml(s.title) + ' (' + (s.items || []).length + ' 条)').join('<br>')}
    </div>
  `;
}

function switchMode(mode){
  state.currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  const glider = $('modeGlider');
  glider.style.transform = mode === 'guide' ? 'translateX(100%)' : 'translateX(0)';
  $('cardView').classList.toggle('active', mode === 'card');
  $('guideView').classList.toggle('active', mode === 'guide');
  renderTitle();
  if (mode === 'guide') renderGuideAll();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function renderAll(){
  renderAvatar();
  renderTitle();
  renderTabs();
  renderFilterRow();
  renderStack();
  renderGuideAll();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', function(){
    switchMode(this.dataset.mode);
  });
});

$('userAvatar').onclick = ()=> $('userAvatarInput').click();
$('userAvatarInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await compressImage(file, 200, 0.75);
    state.userAvatar = dataUrl;
    renderAvatar();
    saveData();
    showToast('头像已更新 ♡');
  } catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};

$('titleDisplay').onclick = ()=>{
  $('editMainTitle').value = state.mainTitle || '';
  $('editSubtitle').value = state.subtitle || '';
  $('titleOverlay').classList.add('show');
};
$('titleCancelBtn').onclick = ()=> $('titleOverlay').classList.remove('show');
$('titleSaveBtn').onclick = ()=>{
  state.mainTitle = $('editMainTitle').value.trim() || '卡片档案';
  state.subtitle = $('editSubtitle').value.trim();
  $('titleOverlay').classList.remove('show');
  renderTitle();
  saveData();
  showToast('标题已更新 ♡');
};
$('titleOverlay').onclick = (e)=>{ if (e.target.id === 'titleOverlay') $('titleOverlay').classList.remove('show'); };

$('searchInput').addEventListener('input', ()=>{
  renderStack();
  renderTitle();
});

$('cardGrid').addEventListener('click', (e)=>{
  const favBtn = e.target.closest('[data-card-fav]');
  if (favBtn){
    e.stopPropagation();
    const c = state.cards.find(x => x.id === favBtn.dataset.cardFav);
    if (c){
      c.pinned = !c.pinned;
      saveData();
      renderStack();
      renderTitle();
      showToast(c.pinned ? '已收藏 ♡' : '已取消收藏');
    }
    return;
  }
  const cardEl = e.target.closest('[data-card]');
  if (cardEl) openDetailModal(cardEl.dataset.card);
});

$('detailOverlay').onclick = (e)=>{ if (e.target.id === 'detailOverlay') closeDetailModal(); };
$('detailCloseBtn').onclick = closeDetailModal;
$('detailCopyBtn').onclick = ()=>{
  const card = state.cards.find(c => c.id === currentDetailId);
  if (card) copyText(card.content, $('detailCopyBtn'));
};
$('detailEditBtn').onclick = ()=>{
  const card = state.cards.find(c => c.id === currentDetailId);
  if (card){ closeDetailModal(); openEditModal(card); }
};
$('detailPinBtn').onclick = ()=>{
  const card = state.cards.find(c => c.id === currentDetailId);
  if (card){
    card.pinned = !card.pinned;
    saveData();
    $('detailPinBtn').textContent = card.pinned ? '★ 已收藏' : '☆ 收藏';
    renderAll();
    showToast(card.pinned ? '已收藏 ♡' : '已取消收藏');
  }
};
$('detailDelBtn').onclick = ()=>{
  const id = currentDetailId;
  if (!id) return;
  if (!confirm('确定删除这条记录吗？此操作无法撤销。')) return;
  state.cards = state.cards.filter(c => c.id !== id);
  saveData();
  closeDetailModal();
  renderAll();
  showToast('已删除');
};

$('fabAdd').onclick = ()=>{
  if (state.currentMode === 'guide') {
    $('guideImportInput').click();
  } else {
    openAddModal();
  }
};
$('cancelBtn').onclick = closeModal;
$('saveBtn').onclick = saveEntry;
$('overlay').onclick = (e)=>{ if (e.target.id === 'overlay') closeModal(); };
$('fPinned').addEventListener('change', updateToggleLabel);

$('catManageCloseBtn').onclick = closeCatManage;
$('catManageOverlay').onclick = (e)=>{ if (e.target.id === 'catManageOverlay') closeCatManage(); };
$('catAddNewBtn').onclick = ()=> openCatModal(null);
$('catCancelBtn').onclick = closeCatModal;
$('catSaveBtn').onclick = saveCategory;
$('catOverlay').onclick = (e)=>{ if (e.target.id === 'catOverlay') closeCatModal(); };
$('uploadCoverBtn').onclick = ()=> $('coverFileInput').click();
$('clearCoverBtn').onclick = ()=>{ pendingCoverData = null; updateCoverPreview(); };
$('coverFileInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  try { pendingCoverData = await compressImage(file, 200, 0.75); updateCoverPreview(); }
  catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};

$('exportBtn').onclick = exportData;
$('importBtn').onclick = ()=> $('importFileInput').click();
$('importFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  importData(file);
  e.target.value = '';
};

$('guideItemOverlay').onclick = (e)=>{ if (e.target.id === 'guideItemOverlay') closeGuideItem(); };
$('gDetailCloseBtn').onclick = closeGuideItem;
$('gDetailFavBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);
  const item = section.items.find(i => i.id === currentGuideItem.itemId);
  item.faved = !item.faved;
  saveData();
  $('gDetailFavBtn').textContent = item.faved ? '★ 已收藏' : '☆ 收藏';
  renderGuideAll();
  showToast(item.faved ? '已收藏 ♡' : '已取消收藏');
};
$('gDetailEditBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);
  const item = section.items.find(i => i.id === currentGuideItem.itemId);
  editingGuideItem = { ...currentGuideItem };
  $('gEditTitle').value = item.title;
  $('gEditContent').value = item.content;
  $('guideItemOverlay').classList.remove('show');
  $('guideEditOverlay').classList.add('show');
};
$('gDetailDelBtn').onclick = ()=>{
  if (!currentGuideItem) return;
  if (!confirm('确定删除这条剧情吗？此操作无法撤销。')) return;
  const guide = state.guides.find(g => g.id === currentGuideItem.guideId);
  const section = guide.sections.find(s => s.id === currentGuideItem.sectionId);
  section.items = section.items.filter(i => i.id !== currentGuideItem.itemId);
  saveData();
  closeGuideItem();
  renderGuideAll();
  showToast('已删除');
};

$('gEditCancelBtn').onclick = ()=>{
  $('guideEditOverlay').classList.remove('show');
  editingGuideItem = null;
};
$('gEditSaveBtn').onclick = ()=>{
  if (!editingGuideItem) return;
  const guide = state.guides.find(g => g.id === editingGuideItem.guideId);
  const section = guide.sections.find(s => s.id === editingGuideItem.sectionId);
  const item = section.items.find(i => i.id === editingGuideItem.itemId);
  const newTitle = $('gEditTitle').value.trim();
  const newContent = $('gEditContent').value.trim();
  if (!newTitle){ showToast('标题不能为空'); return; }
  item.title = newTitle;
  item.content = newContent;
  saveData();
  $('guideEditOverlay').classList.remove('show');
  editingGuideItem = null;
  renderGuideAll();
  showToast('已保存 ♡');
};
$('guideEditOverlay').onclick = (e)=>{ if (e.target.id === 'guideEditOverlay') $('guideEditOverlay').classList.remove('show'); };

$('guideManageCloseBtn').onclick = closeGuideManage;
$('guideManageOverlay').onclick = (e)=>{ if (e.target.id === 'guideManageOverlay') closeGuideManage(); };

$('gRenameCancelBtn').onclick = ()=>{
  $('guideRenameOverlay').classList.remove('show');
  renamingGuideId = null;
};
$('gRenameSaveBtn').onclick = ()=>{
  if (!renamingGuideId) return;
  const g = state.guides.find(x => x.id === renamingGuideId);
  const name = $('gRenameInput').value.trim();
  if (!name){ showToast('名称不能为空'); return; }
  g.series = name;
  saveData();
  $('guideRenameOverlay').classList.remove('show');
  renamingGuideId = null;
  renderGuideManageList();
  renderGuideAll();
  showToast('已重命名 ♡');
};
$('guideRenameOverlay').onclick = (e)=>{ if (e.target.id === 'guideRenameOverlay') $('guideRenameOverlay').classList.remove('show'); };

$('guideImportBtn').onclick = ()=> $('guideImportInput').click();
$('guideImportInput').onchange = (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try {
      const text = ev.target.result;
      const guide = parseMarkdownOrText(text);
      pendingImport = guide;
      renderGuidePreview(guide, file.name);
      $('guidePreviewOverlay').classList.add('show');
    } catch(err){
      showToast('解析失败');
      console.error(err);
    }
  };
  reader.onerror = ()=> showToast('文件读取失败');
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
};

$('guidePreviewCancelBtn').onclick = ()=>{
  $('guidePreviewOverlay').classList.remove('show');
  pendingImport = null;
};
$('guidePreviewConfirmBtn').onclick = ()=>{
  if (!pendingImport) return;
  const exist = state.guides.find(g => g.series === pendingImport.series);
  if (exist){
    if (!confirm(`已存在「${pendingImport.series}」，是否覆盖？`)) return;
    state.guides = state.guides.filter(g => g.id !== exist.id);
  }
  state.guides.push(pendingImport);
  state.activeGuide = pendingImport.id;
  state.activeGuideSection = null;
  state.guideShowFav = false;
  saveData();
  $('guidePreviewOverlay').classList.remove('show');
  pendingImport = null;
  closeGuideManage();
  renderGuideAll();
  showToast('导入成功 ♡');
};

loadData();
</script>
</body>
</html>
