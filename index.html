<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>my archive :)</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡片档案">
<style>
  :root{
    --bg: #FBF6F7;
    --check-a: #fff5fd;
    --check-b: #fefcfd;
    --card: #FFFFFF;
    --ink: #4A3F42;
    --ink-soft: #B49CA5;
    --line: #F6DFE6;
    --theme: #e897a8;
    --theme-light: #fce3ea;
    --status-bg: #fbe3ec;
    --radius: 20px;
    --radius-sm: 12px;
    --serif: "Songti SC", "STSong", "Noto Serif SC", serif;
    --round: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --script: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--round);
    min-height: 100vh;
  }
  .app { 
    width:100%;
    max-width: 720px; 
    margin: 0 auto; 
    padding: 18px 14px 90px; 
}

  /* ===== Header ===== */
  .masthead{
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 6px 20px rgba(255,143,171,0.14);
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    gap: 12px;
  }
  .masthead::after { display: none; }
  .masthead-left{
    display:flex;
    align-items:center;
    gap: 12px;
    position:relative; z-index:1;
    flex:1;
    min-width:0;
  }
  .user-avatar{
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #fff;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 24px;
    color: var(--theme);
    overflow:hidden;
    cursor:pointer;
    transition: opacity .2s;
    box-shadow: 0 2px 8px rgba(232,151,168,0.15);
  }
  .user-avatar:hover { opacity: 0.7; }
  .user-avatar img { width:100%; height:100%; object-fit:cover; }
  .masthead-titles {
    min-width:0;
    cursor:pointer;
  }
  .masthead-titles:hover .masthead-eyebrow,
  .masthead-titles:hover .masthead-title {
    opacity: 0.7;
  }
  .masthead-title{
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: opacity .2s;
  }
  .masthead-eyebrow{
    font-family: var(--script);
    font-style: italic;
    font-size: 12px;
    color: var(--theme);
    letter-spacing: 1px;
    transition: opacity .2s;
    margin-top: 2px;
  }
  .masthead-count{
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--check-a);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    position: relative; z-index:1;
  }

  /* ===== Search ===== */
  .search-row{ margin-bottom: 14px; position:relative; }
  .search-row input{
    width:100%;
    background: var(--card);
    border: none;
    border-radius: 999px;
    padding: 13px 18px 13px 44px;
    font-size: 14px;
    font-family: var(--round);
    color: var(--ink);
    outline: none;
    box-shadow: 0 3px 10px rgba(255,143,171,0.1);
  }
  .search-row input::placeholder{ color: var(--ink-soft); }
  .search-icon img{width:18px;height:18px;object-fit:contain;display:block;}\n  .search-icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    font-size: 20px;
    color: var(--theme);
    pointer-events:none;
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }

  /* ===== Tabs ===== */
  .tabs-wrap{ margin-bottom: 18px; }
  .tabs{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    cursor: pointer;
    min-width: 60px;
    padding: 8px 6px 6px;
    border-radius: 16px;
    transition: background .15s ease;
  }
  .tab.active{
    background: linear-gradient(180deg, #FAE1EA 0%, #F8D9E5 45%, #FBEDF2 100%);
  }
  .tab-avatar{
    width: 48px; height:48px;
    border-radius: 50%;
    background: #ffffff;
    display:flex; align-items:center; justify-content:center;
    border: none;
    overflow:hidden;
    transition: transform .15s ease;
    color: var(--theme);
    font-size: 22px;
  }
  .tab-avatar .letter {
    font-size: 19px;
    font-weight: 600;
    color: var(--theme);
  }
  .tab-avatar img{ width:100%; height:100%; object-fit:contain; }
  .tab-avatar svg{ width: 22px; height: 22px; }
  .tab.active .tab-avatar{
    transform: scale(1.05);
  }
  .tab-status .tab-avatar {
    background: var(--status-bg);
  }
  .tab-label{
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.active .tab-label{ color: var(--theme); font-weight: 700; }
  .tab-all .tab-avatar, .tab-manage .tab-avatar {
    background: #ffffff;
  }

  /* ===== Filter chips ===== */
  .filter-row{
    display:flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .filter-chip{
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 15px;
    border-radius: 999px;
    background: #ffffff;
    color: var(--ink-soft);
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    transition: background .15s, color .15s;
  }
  .filter-chip.active{
    background: var(--theme);
    color: #fff;
    box-shadow: 0 3px 10px rgba(232,151,168,0.35);
  }

  /* ===== Grid Cards ===== */
  .stack{
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    align-items: stretch;
  }
  @media (max-width: 390px){
    .stack{
      gap:10px;
    }
  }
  .entry{
    position: relative;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 3px 12px rgba(255,143,171,0.10);
    padding: 14px 12px 12px;
    min-width:0;
    height: 220px;
    display:flex;
    flex-direction:column;
    gap: 7px;
    cursor:pointer;
    transition: box-shadow .2s, transform .1s;
  }
  .entry:active{ transform: scale(0.98); }
  .entry.pinned{ box-shadow: 0 3px 16px rgba(232,151,168,0.35); }
  .entry-ribbon{
    position:absolute;
    top: -2px; right: 16px;
    width: 22px; height: 28px;
    background: var(--theme);
    border-radius: 0 0 5px 5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 6px rgba(232,151,168,0.4);
    z-index: 2;
  }
  .entry-ribbon svg{ width: 12px; height: 12px; }
  .entry-avatar{
    width:40px; height:40px; border-radius:50%;
    background: #ffffff;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    font-weight:600;
    color: #fff;
    overflow:hidden;
    text-shadow: 0 0 2px rgba(0,0,0,0.1);
  }
  .entry-avatar.status-bg { background: var(--status-bg); color: var(--ink); }
  .entry-avatar img{ width:100%; height:100%; object-fit:cover; }
  .entry-title{
    font-weight:700;
    font-size:14.5px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cat-label {
    align-self:flex-start;
    border-radius: 10px;
    padding: 3px 10px;
    display: inline-block;
    line-height: 1.4;
    color: #444;
    font-weight: 600;
    font-size: 11px;
    background: #f0f0f0;
  }
  .entry-excerpt{
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.4em;
  }
  .entry-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: auto;
    padding-top: 4px;
  }
  .entry-date{
    font-size: 10px;
    color: var(--ink-soft);
  }
  .entry-expand-btn{
    width: 24px; height:24px;
    border-radius: 50%;
    background: var(--check-a, #fff5fd);
    border: none;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-soft);
    flex-shrink:0;
  }
  .entry-expand-btn svg{ width:14px; height:14px; }

  /* ===== Detail overlay entry content ===== */
  .detail-header{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .detail-avatar{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff; overflow:hidden; flex-shrink:0;
  }
  .detail-avatar img{ width:100%; height:100%; object-fit:cover; }
  .detail-title{ font-size:16px; font-weight:800; }
  .detail-meta{ font-size:11px; color: var(--ink-soft); margin-top:2px; }
  .entry-content{
    font-size: 13.5px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 10px;
    max-height: 320px;
    overflow-y: auto;
  }
  .entry-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{
    font-size: 12px;
    font-weight:600;
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    background: var(--check-a);
    color: var(--ink);
    cursor:pointer;
    transition: background .15s, color .15s, transform .1s;
  }
  .btn:active{ transform: scale(0.96); }
  .btn.copy{ background: var(--theme); color: #fff; }
  .btn.copy.done{ background: var(--mint, #B9E4CE); }
  .btn.edit{ background: var(--sky, #BEE0F2); color: #37505c; }
  .btn.del{ background: transparent; color: var(--theme); margin-left:auto; }
  .empty{
    text-align:center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }
  .empty-emoji{ font-size: 34px; margin-bottom: 10px; }
  .empty-sub{ font-size: 12px; margin-top:6px; }

  /* ===== Toggle Switch ===== */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .toggle {
    position: relative;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #ddd;
    border-radius: 26px;
    transition: background .2s;
  }
  .toggle .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
  }
  .toggle input:checked + .slider {
    background: var(--theme);
  }
  .toggle input:checked + .slider::before {
    transform: translateX(18px);
  }
  .toggle-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  /* ===== FAB ===== */
  .fab{
    position: fixed;
    right: 20px; bottom: 24px;
    width: 56px; height:56px;
    border-radius: 50%;
    background: var(--theme);
    color: #fff;
    font-size: 26px;
    display:flex; align-items:center; justify-content:center;
    border:none;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(232,151,168,0.45);
    z-index: 20;
  }
  .fab:active{ transform: scale(0.94); }

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0;
    background: rgba(91,74,80,0.32);
    display:none;
    align-items:flex-end;
    z-index: 30;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--bg);
    width:100%;
    max-height: 90vh;
    border-radius: 26px 26px 0 0;
    padding: 20px 18px 24px;
    overflow-y:auto;
    animation: slideup .22s ease;
  }
  @keyframes slideup{ from{ transform: translateY(30px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  .sheet-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:16px;
    display:flex; align-items:center; gap:6px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input[type="text"], .field textarea, .field select{
    width:100%;
    background: var(--card);
    border:none;
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size:14px;
    font-family: var(--round);
    color: var(--ink);
    outline:none;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .field textarea{ min-height: 150px; resize: vertical; line-height:1.6; }
  .field input:focus, .field textarea:focus, .field select:focus{ box-shadow: inset 0 0 0 1.5px var(--theme); }
  .cover-upload{
    display:flex; align-items:center; gap:14px;
  }
  .cover-preview{
    width:64px; height:64px; border-radius:50%;
    background: var(--check-a);
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    overflow:hidden;
    flex-shrink:0;
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .cover-preview img{ width:100%; height:100%; object-fit:cover; }
  .cover-btns{ display:flex; flex-direction:column; gap:6px; }
  .cover-btn-row{ display:flex; gap:8px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions .btn{ flex:1; text-align:center; padding:12px; font-size:13.5px; }
  .btn.primary{ background: var(--theme); color: #fff; }
  .cat-manage-row{
    display:flex; align-items:center; gap:12px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .cat-manage-row .cover-preview{ width:38px; height:38px; font-size:15px; }
  .cat-manage-name{ flex:1; font-size:14px; font-weight:600; }
  .cat-manage-actions{ display:flex; gap:6px; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%;
    border:none; background: var(--check-a);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; color: var(--ink);
  }
  .icon-btn.del{ color: var(--theme); }
  .toast{
    position: fixed;
    top: 18px; left:50%; transform: translateX(-50%);
    background: var(--theme); color: #fff;
    font-size: 12.5px; font-weight:600;
    padding: 10px 18px; border-radius: 999px;
    z-index: 50;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease, top .2s ease;
    box-shadow: 0 6px 16px rgba(232,151,168,0.4);
  }
  .toast.show{ opacity:1; top: 26px; }
  .hidden-file{ display:none; }
  .data-manage-section{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1.5px dashed var(--line);
  }
  .data-manage-title{
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }

/* v4 search icon fix */
.search-row{position:relative;display:block;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:flex;align-items:center;justify-content:center;z-index:2;}
.search-icon img{width:18px;height:18px;display:block;object-fit:contain;}
</style>
</head>

<script>
const STORAGE_KEY = 'card-archive-data-v4';
const DEFAULT_EMOJI = ['🎭','🐾','📊','⌘','✎','✦'];
// 五个柔和色值，顺序对应默认分类：面具/NPC/状态栏/指令/番外
const CAT_COLORS = [
  '#f2d4f6',
  '#fae29c',
  '#cde6fc',
  '#ddefe3',
  '#d3defb'
];

let state = {
  categories: [
    { id: 'mask', name: '面具', cover: null },
    { id: 'npc', name: 'NPC', cover: null },
    { id: 'status', name: '状态栏', cover: null },
    { id: 'cmd', name: '指令', cover: null },
    { id: 'extra', name: '番外', cover: null }
  ],
  cards: [],
  activeTab: 'all',
  activeFilter: 'edited',
  userAvatar: null,
  mainTitle: '卡片档案',
  subtitle: 'my little'
};
let currentDetailId = null;
let editingId = null;
let editingCatId = null;
let pendingCoverData = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
}
function hasClaudeStorage(){ return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
function hasLocalStorage(){ try{ const t='__'+Date.now(); localStorage.setItem(t,'1'); localStorage.removeItem(t); return true; }catch(e){ return false; } }

async function loadData(){
  let raw = null;
  if(hasClaudeStorage()){
    try{ const res = await withTimeout(window.storage.get(STORAGE_KEY, false), 5000); if(res && res.value) raw = res.value; }catch(e){}
  }
  if(raw === null && hasLocalStorage()){
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed.categories) state.categories = parsed.categories;
      if(parsed.cards) state.cards = parsed.cards;
      if(parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if(parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if(parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
    }catch(e){}
  }
  state.cards.forEach(c => {
    if (c.pinned === undefined) c.pinned = false;
    if (c.faved !== undefined) delete c.faved;
    if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
  });
  if (state.activeFilter === undefined) state.activeFilter = 'edited';
  renderAll();
}

async function saveData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle
  });
  let ok = false;
  if(hasClaudeStorage()){
    try{ await withTimeout(window.storage.set(STORAGE_KEY, payload, false), 5000); ok = true; }catch(e){}
  }
  if(hasLocalStorage()){
    try{ localStorage.setItem(STORAGE_KEY, payload); ok = true; }catch(e){}
  }
  if(!ok) showToast('⚠️ 保存失败！请导出备份');
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._timer); showToast._timer=setTimeout(()=>t.classList.remove('show'),1600); }

// ---------- 标题 ----------
function renderTitle() {
  document.getElementById('titleDisplay').textContent = state.mainTitle || '卡片档案';
  document.getElementById('subtitleDisplay').textContent = state.subtitle || '';
}
document.getElementById('titleEditor').onclick = ()=>{
  document.getElementById('editMainTitle').value = state.mainTitle || '';
  document.getElementById('editSubtitle').value = state.subtitle || '';
  document.getElementById('titleOverlay').classList.add('show');
};
document.getElementById('titleCancelBtn').onclick = ()=> document.getElementById('titleOverlay').classList.remove('show');
document.getElementById('titleSaveBtn').onclick = ()=>{
  state.mainTitle = document.getElementById('editMainTitle').value.trim() || '卡片档案';
  state.subtitle = document.getElementById('editSubtitle').value.trim();
  document.getElementById('titleOverlay').classList.remove('show');
  renderTitle();
  saveData();
  showToast('标题已更新 ♡');
};
document.getElementById('titleOverlay').onclick = (e)=>{ if(e.target.id==='titleOverlay') document.getElementById('titleOverlay').classList.remove('show'); };

// ---------- 用户头像 ----------
function renderAvatar() {
  const el = document.getElementById('userAvatar');
  if (state.userAvatar) el.innerHTML = `<img src="${state.userAvatar}" alt="avatar">`;
  else el.innerHTML = '👤';
}
document.getElementById('userAvatar').onclick = ()=> document.getElementById('userAvatarInput').click();
document.getElementById('userAvatarInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file, 200, 0.75);
    state.userAvatar = dataUrl;
    renderAvatar();
    saveData();
    showToast('头像已更新 ♡');
  }catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};

function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxSize){ h=h*(maxSize/w); w=maxSize; }
        else if(h>maxSize){ w=w*(maxSize/h); h=maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// ---------- 分类辅助 ----------
function catObj(id){ return state.categories.find(c=>c.id===id); }
function catName(id){ const c=catObj(id); return c ? c.name : '未分类'; }
function isStatusCategory(cat){ return cat && cat.name === '状态栏'; }
function getCategoryColor(catId){
  const idx = state.categories.findIndex(c => c.id === catId);
  return CAT_COLORS[idx >= 0 ? idx % CAT_COLORS.length : 0];
}

  state.categories.forEach(cat=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (state.activeTab===cat.id ? ' active' : '');
    if (isStatusCategory(cat)) btn.classList.add('tab-status');
    const coverHtml = cat.cover ? `<img src="${cat.cover}" alt="">` : `<span class="letter">${cat.name ? cat.name.charAt(0) : '?'}</span>`;
    btn.innerHTML = `<div class="tab-avatar">${coverHtml}</div><div class="tab-label">${escapeHtml(cat.name)}</div>`;
    btn.onclick = ()=>{ state.activeTab=cat.id; renderAll(); };
    tabs.appendChild(btn);
  });

// ---------- 筛选栏（最近编辑/最近创建/收藏） ----------
function renderFilterRow(){
  const wrap = document.getElementById('filterRow');
  if(!wrap) return;
  wrap.innerHTML = '';
  const options = [
    { id: 'edited', label: '最近编辑' },
    { id: 'created', label: '最近创建' },
    { id: 'favorite', label: '收藏' }
  ];
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (state.activeFilter===opt.id ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = ()=>{ state.activeFilter = opt.id; renderAll(); };
    wrap.appendChild(btn);
  });
}

// ---------- 获取卡片列表 ----------
function getFilteredCards(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = state.cards.filter(c=>{
    const matchTab = state.activeTab==='all' || c.categoryId===state.activeTab;
    const matchQ = !q || c.title.toLowerCase().includes(q) || c.content.toLowerCase().includes(q);
    return matchTab && matchQ;
  });
  if(state.activeFilter === 'favorite'){
    list = list.filter(c => c.pinned);
  }
  // 收藏（置顶）永远排在列表最前
  list.sort((a,b)=>{
    if ((b.pinned ? 1 : 0) !== (a.pinned ? 1 : 0)){
      return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    }
    if(state.activeFilter === 'created'){
      return (b.createdAt||b.updatedAt||0) - (a.createdAt||a.updatedAt||0);
    }
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return list;
}

// ---------- 渲染卡片网格 ----------
function renderStack(){
  const stack = document.getElementById('stack');
  const list = getFilteredCards();
  document.getElementById('countLabel').textContent = list.length + ' 条';
  if(list.length===0){
    stack.innerHTML = `<div class="empty"><div class="empty-emoji">🎀</div>空空如也<div class="empty-sub">点右下角 + 新建第一条记录吧</div></div>`;
    return;
  }
  stack.innerHTML = '';

  list.forEach(card=>{
    const el = document.createElement('div');
    el.className = 'entry' + (card.pinned ? ' pinned' : '');
    const cat = catObj(card.categoryId);
    const catColor = getCategoryColor(card.categoryId);
    let avatarContent;
    if (cat && cat.cover) avatarContent = `<img src="${cat.cover}" alt="">`;
    else avatarContent = cat ? cat.name.charAt(0) : '?';

    const date = card.updatedAt ? new Date(card.updatedAt).toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
    let excerpt = card.content || '';
    if (excerpt.length === 0) excerpt = '（无内容）';
    const isStatus = isStatusCategory(cat);
    let avatarBg = catColor;
    if (isStatus) avatarBg = 'var(--status-bg)';
    let avatarColor = '#fff';
    if (isStatus) avatarColor = 'var(--ink)';
    const labelBg = catColor;

// ---------- 详情弹窗 ----------
function openDetailModal(cardId){
  const card = state.cards.find(c=>c.id===cardId);
  if(!card) return;
  currentDetailId = cardId;
  const cat = catObj(card.categoryId);
  const catColor = getCategoryColor(card.categoryId);
  const isStatus = isStatusCategory(cat);
  let avatarContent;
  if (cat && cat.cover) avatarContent = `<img src="${cat.cover}" alt="">`;
  else avatarContent = cat ? cat.name.charAt(0) : '?';
  const avatarBg = isStatus ? 'var(--status-bg)' : catColor;
  const avatarColor = isStatus ? 'var(--ink)' : '#fff';
  const date = card.updatedAt ? new Date(card.updatedAt).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';

  document.getElementById('detailHeaderHtml').innerHTML = `
    <div class="detail-avatar" style="background:${avatarBg}; color:${avatarColor};">${avatarContent}</div>
    <div>
      <div class="detail-title">${escapeHtml(card.title || '（无标题）')}</div>
      <div class="detail-meta">${catName(card.categoryId)} · ${date}</div>
    </div>
  `;
  document.getElementById('detailContent').textContent = card.content || '';
  document.getElementById('detailPinBtn').textContent = card.pinned ? '★ 已收藏' : '☆ 收藏';
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetailModal(){
  document.getElementById('detailOverlay').classList.remove('show');
  currentDetailId = null;
}
document.getElementById('detailOverlay').onclick = (e)=>{ if(e.target.id==='detailOverlay') closeDetailModal(); };
document.getElementById('detailCloseBtn').onclick = closeDetailModal;
document.getElementById('detailCopyBtn').onclick = ()=>{
  const card = state.cards.find(c=>c.id===currentDetailId);
  if(card) copyText(card.content, document.getElementById('detailCopyBtn'));
};
document.getElementById('detailEditBtn').onclick = ()=>{
  const card = state.cards.find(c=>c.id===currentDetailId);
  if(card){ closeDetailModal(); openEditModal(card); }
};
document.getElementById('detailPinBtn').onclick = ()=>{
  const card = state.cards.find(c=>c.id===currentDetailId);
  if(card){
    card.pinned = !card.pinned;
    saveData();
    document.getElementById('detailPinBtn').textContent = card.pinned ? '★ 已收藏' : '☆ 收藏';
    renderAll();
  }
};
document.getElementById('detailDelBtn').onclick = ()=>{
  if(currentDetailId){ closeDetailModal(); deleteCard(currentDetailId); }
};

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

function copyText(text, btnEl){
  const doCopy = async ()=>{
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
  };
  doCopy().then(()=>{
    showToast('已复制 ♡');
    if(btnEl){
      btnEl.classList.add('done');
      const orig=btnEl.textContent;
      btnEl.textContent='已复制 ✓';
      setTimeout(()=>{ btnEl.classList.remove('done'); btnEl.textContent=orig; },1200);
    }
  });
}

function deleteCard(id){
  if(!confirm('确定删除这条记录吗？此操作无法撤销。')) return;
  state.cards = state.cards.filter(c=>c.id!==id);
  saveData();
  renderAll();
}

// ---------- 条目 新建/编辑 ----------
function openAddModal(){
  editingId = null;
  document.getElementById('sheetTitle').textContent = '✎ 新建条目';
  document.getElementById('fTitle').value = '';
  document.getElementById('fContent').value = '';
  document.getElementById('fPinned').checked = false;
  updateToggleLabel();
  populateCategorySelect();
  if(state.activeTab !== 'all') document.getElementById('fCategory').value = state.activeTab;
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('fTitle').focus(), 100);
}
function openEditModal(card){
  editingId = card.id;
  document.getElementById('sheetTitle').textContent = '✎ 编辑条目';
  document.getElementById('fTitle').value = card.title || '';
  document.getElementById('fContent').value = card.content || '';
  document.getElementById('fPinned').checked = card.pinned || false;
  updateToggleLabel();
  populateCategorySelect();
  document.getElementById('fCategory').value = card.categoryId;
  document.getElementById('overlay').classList.add('show');
}
function populateCategorySelect(){
  const sel = document.getElementById('fCategory');
  sel.innerHTML = '';
  state.categories.forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name;
    sel.appendChild(opt);
  });
}
function updateToggleLabel(){
  const checked = document.getElementById('fPinned').checked;
  document.getElementById('fPinnedLabel').textContent = checked ? '开启' : '关闭';
}
document.getElementById('fPinned').addEventListener('change', updateToggleLabel);

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
function saveEntry(){
  const title = document.getElementById('fTitle').value.trim();
  const content = document.getElementById('fContent').value.trim();
  const categoryId = document.getElementById('fCategory').value;
  const pinned = document.getElementById('fPinned').checked;
  if(!content){ showToast('内容不能为空'); return; }
  if(!categoryId){ showToast('请先创建一个分类'); return; }
  if(editingId){
    const card = state.cards.find(c=>c.id===editingId);
    if(card){ card.title = title; card.content = content; card.categoryId = categoryId; card.pinned = pinned; card.updatedAt = Date.now(); }
  }else{
    const now = Date.now();
    state.cards.push({ id: uid(), title, content, categoryId, pinned, createdAt: now, updatedAt: now });
  }
  saveData();
  closeModal();
  renderAll();
  showToast('已保存 ♡');
}

// ---------- 分类管理 ----------
function openCatManage(){
  renderCatManageList();
  document.getElementById('catManageOverlay').classList.add('show');
}
function closeCatManage(){ document.getElementById('catManageOverlay').classList.remove('show'); }
function renderCatManageList(){
  const list = document.getElementById('catManageList');
  list.innerHTML = '';
  state.categories.forEach(cat=>{
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    const coverHtml = cat.cover ? `<img src="${cat.cover}" alt="">` : `<span>${cat.name ? cat.name.charAt(0) : '?'}</span>`;
    row.innerHTML = `
      <div class="cover-preview" style="background:#ffffff;color:var(--theme);font-weight:600;">${coverHtml}</div>
      <div class="cat-manage-name">${escapeHtml(cat.name)}</div>
      <div class="cat-manage-actions">
        <button class="icon-btn edit-cat">✎</button>
        <button class="icon-btn del del-cat">✕</button>
      </div>
    `;
    row.querySelector('.edit-cat').onclick = ()=> openCatModal(cat);
    row.querySelector('.del-cat').onclick = ()=> deleteCategory(cat.id);
    list.appendChild(row);
  });
}
function deleteCategory(id){
  const count = state.cards.filter(c=>c.categoryId===id).length;
  const msg = count > 0 ? `该分类下有 ${count} 条记录，删除分类会一并删除这些记录，确定继续吗？` : '确定删除这个分类吗？';
  if(!confirm(msg)) return;
  state.categories = state.categories.filter(c=>c.id!==id);
  state.cards = state.cards.filter(c=>c.categoryId!==id);
  if(state.activeTab===id) state.activeTab = 'all';
  saveData();
  renderCatManageList();
  renderAll();
  showToast('分类已删除');
}
function openCatModal(existing){
  editingCatId = existing ? existing.id : null;
  pendingCoverData = existing ? existing.cover : null;
  document.getElementById('catSheetTitle').textContent = existing ? '✎ 编辑分类' : '✦ 新建分类';
  document.getElementById('newCatName').value = existing ? existing.name : '';
  updateCoverPreview();
  document.getElementById('catOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('newCatName').focus(), 100);
}
function closeCatModal(){ document.getElementById('catOverlay').classList.remove('show'); }
function updateCoverPreview(){
  const preview = document.getElementById('coverPreview');
  if(pendingCoverData) preview.innerHTML = `<img src="${pendingCoverData}" alt="">`;
  else preview.innerHTML = '🖼';
}
function saveCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name){ showToast('请输入分类名称'); return; }
  if(editingCatId){
    const cat = catObj(editingCatId);
    if(cat){ cat.name = name; cat.cover = pendingCoverData; }
  }else{
    const id = uid();
    state.categories.push({ id, name, cover: pendingCoverData });
    state.activeTab = id;
  }
  saveData();
  closeCatModal();
  renderCatManageList();
  renderAll();
  showToast('已保存 ♡');
}

// ---------- 导出导入 ----------
function exportData(){
  const payload = JSON.stringify({
    categories: state.categories,
    cards: state.cards,
    userAvatar: state.userAvatar,
    mainTitle: state.mainTitle,
    subtitle: state.subtitle,
    exportedAt: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toLocaleDateString('zh-CN').replace(/\//g,'-');
  a.href = url; a.download = `卡片档案备份_${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出备份 ♡');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.categories || !parsed.cards){ showToast('文件格式不正确'); return; }
      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state.categories = parsed.categories;
      state.cards = parsed.cards;
      if(parsed.userAvatar !== undefined) state.userAvatar = parsed.userAvatar;
      if(parsed.mainTitle) state.mainTitle = parsed.mainTitle;
      if(parsed.subtitle !== undefined) state.subtitle = parsed.subtitle;
      state.activeTab = 'all';
      state.activeFilter = 'edited';
      currentDetailId = null;
      state.cards.forEach(c => {
        if (c.pinned === undefined) c.pinned = false;
        if (c.createdAt === undefined) c.createdAt = c.updatedAt || Date.now();
      });
      saveData();
      renderAll();
      showToast('导入成功 ♡');
    }catch(err){ showToast('文件解析失败'); console.error(err); }
  };
  reader.onerror = () => showToast('文件读取失败');
  reader.readAsText(file);
}

// ---------- 事件绑定 ----------
document.getElementById('fabAdd').onclick = openAddModal;
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = saveEntry;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
document.getElementById('catManageCloseBtn').onclick = closeCatManage;
document.getElementById('catManageOverlay').onclick = (e)=>{ if(e.target.id==='catManageOverlay') closeCatManage(); };
document.getElementById('catAddNewBtn').onclick = ()=> openCatModal(null);
document.getElementById('catCancelBtn').onclick = closeCatModal;
document.getElementById('catSaveBtn').onclick = saveCategory;
document.getElementById('catOverlay').onclick = (e)=>{ if(e.target.id==='catOverlay') closeCatModal(); };
document.getElementById('uploadCoverBtn').onclick = ()=> document.getElementById('coverFileInput').click();
document.getElementById('clearCoverBtn').onclick = ()=>{ pendingCoverData = null; updateCoverPreview(); };
document.getElementById('coverFileInput').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{ pendingCoverData = await compressImage(file, 200, 0.75); updateCoverPreview(); }
  catch(err){ showToast('图片处理失败'); }
  e.target.value = '';
};
document.getElementById('searchInput').oninput = renderAll;
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFileInput').click();
document.getElementById('importFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  importData(file);
  e.target.value = '';
};

function renderAll(){
  renderTitle();
  renderAvatar();
  renderTabs();
  renderFilterRow();
  renderStack();
}

loadData();
